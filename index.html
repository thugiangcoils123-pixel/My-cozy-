<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starry Hamilton Adventure</title>
    <style>
        :root {
            --bg: #fff9e1; --primary: #f1c40f; --accent: #e67e22; --text: #5d4037;
        }

        body {
            margin: 0; padding: 0; overflow: hidden; background: var(--bg);
            font-family: 'Segoe UI', cursive, sans-serif; touch-action: none;
        }

        #bg-canvas { position: fixed; inset: 0; z-index: -1; }
        #game-canvas { display: block; cursor: crosshair; }

        /* UI Screens */
        .screen {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255, 249, 225, 0.98); padding: 20px; text-align: center;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.9); border-radius: 40px;
            border: 6px solid var(--primary); padding: 25px;
            box-shadow: 10px 10px 0px var(--accent); width: 90%; max-width: 400px;
        }

        /* Leaderboard Side Panel (Hidden by default) */
        #leaderboard-panel {
            position: fixed; right: -300px; top: 100px; width: 250px;
            background: white; border: 4px solid var(--primary);
            border-radius: 25px 0 0 25px; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 15px; z-index: 500; box-shadow: -5px 5px 15px rgba(0,0,0,0.1);
        }
        #leaderboard-panel.active { right: 0; }

        .lb-item {
            display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
            padding: 8px; border-bottom: 1px dashed var(--primary); font-size: 0.9rem;
        }

        /* Buttons & Inputs */
        input {
            width: 80%; padding: 15px; border-radius: 20px; border: 3px solid var(--primary);
            margin-bottom: 20px; font-size: 1rem; text-align: center; outline: none;
        }

        button {
            background: var(--accent); color: white; border: none; padding: 12px 25px;
            border-radius: 30px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 0 #a04000; transition: 0.2s;
        }
        button:active { transform: translateY(4px); box-shadow: none; }

        .btn-toggle-lb {
            position: fixed; right: 20px; top: 20px; z-index: 600;
            background: var(--primary); font-size: 1.5rem; width: 50px; height: 50px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; pointer-events: auto;
        }

        #mascot {
            position: fixed; bottom: 20px; right: 20px; font-size: 50px;
            z-index: 100; transition: 0.3s;
        }

        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px 0; }
        .avatar-opt {
            font-size: 25px; cursor: pointer; padding: 5px; border-radius: 50%;
            border: 2px solid transparent; transition: 0.2s;
        }
        .avatar-opt.selected { border-color: var(--accent); background: #fffde7; transform: scale(1.2); }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    
    <!-- Màn hình hướng dẫn -->
    <div id="tutorial-screen" class="screen">
        <div class="glass-box">
            <div style="font-size: 80px;">🐥</div>
            <h2 style="color: var(--accent);">Chào bạn nha!</h2>
            <p>Mình là <b>Vịt Vàng</b>. Hãy giúp mình nối các ngôi sao mà không đi lặp lại đường cũ nhé!</p>
            <button onclick="UI.showStart()">BẮT ĐẦU</button>
        </div>
    </div>

    <!-- Màn hình Profile -->
    <div id="start-screen" class="screen" style="display: none;">
        <div class="glass-box">
            <h3>Chọn Avatar & Tên</h3>
            <div class="avatar-grid" id="avatar-list"></div>
            <input type="text" id="user-name" placeholder="Tên của bạn..." maxlength="12">
            <button onclick="game.initSession()">VÀO GAME</button>
        </div>
    </div>

    <!-- In-game UI -->
    <div id="game-stats" style="position:fixed; top:20px; left:20px; display:flex; gap:10px; pointer-events:none;">
        <div class="glass-box" style="padding:10px 20px; width:auto; box-shadow:4px 4px 0 var(--accent)">LV: <span id="lvl">1</span></div>
        <div class="glass-box" style="padding:10px 20px; width:auto; box-shadow:4px 4px 0 var(--accent)">⏱️ <span id="timer">0</span>s</div>
    </div>

    <div class="btn-toggle-lb" onclick="UI.toggleLB()">🏆</div>
    
    <div id="leaderboard-panel">
        <h3 style="text-align:center; margin:0 0 10px 0;">BẢNG XẾP HẠNG</h3>
        <div id="lb-content"></div>
    </div>

    <div id="mascot">🐰</div>

    <div style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:100; display:flex; gap:15px;">
        <button onclick="game.undo()" style="background:#7f8c8d; box-shadow: 0 5px 0 #34495e;">Hoàn tác</button>
        <button onclick="game.restart()" style="background:#e67e22">Chơi lại</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <!-- Win Screen -->
    <div id="win-screen" class="screen" style="display: none;">
        <div class="glass-box">
            <h1 style="color: var(--accent); margin:0">TUYỆT VỜI! ✨</h1>
            <p id="win-msg" style="font-size:1.2rem; margin:20px 0;"></p>
            <button onclick="game.nextLevel()">MÀN TIẾP THEO</button>
        </div>
    </div>

<script>
// --- AUDIO SYSTEM ---
const Sound = {
    ctx: new (window.AudioContext || window.webkitAudioContext)(),
    playWin() {
        const notes = [523.25, 659.25, 783.99, 1046.50]; // Đô - Mi - Sol - Đô (C Chord)
        notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.1);
            gain.gain.setValueAtTime(0, this.ctx.currentTime + i * 0.1);
            gain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + i * 0.1 + 0.05);
            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + i * 0.1 + 0.4);
            osc.start(this.ctx.currentTime + i * 0.1); osc.stop(this.ctx.currentTime + i * 0.1 + 0.5);
        });
    },
    playClick() {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.start(); osc.stop(this.ctx.currentTime + 0.1);
    }
};

// --- UI SYSTEM ---
const UI = {
    showStart() {
        document.getElementById('tutorial-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'flex';
        const grid = document.getElementById('avatar-list');
        ['🐶','🐱','🐻','🦊','🐥','🐸','🐼','🐨'].forEach(a => {
            const span = document.createElement('span');
            span.className = 'avatar-opt' + (a==='🐥'?' selected':'');
            span.innerText = a;
            span.onclick = () => {
                document.querySelectorAll('.avatar-opt').forEach(o => o.classList.remove('selected'));
                span.classList.add('selected');
                game.userAvatar = a;
            };
            grid.appendChild(span);
        });
    },
    toggleLB() { document.getElementById('leaderboard-panel').classList.toggle('active'); }
};

// --- GAME CORE ---
class HamiltonStarry {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.bgCanvas = document.getElementById('bg-canvas');
        this.bgCtx = this.bgCanvas.getContext('2d');
        this.level = 1; this.nodes = []; this.edges = []; this.path = [];
        this.bgStars = []; this.starsBurst = [];
        this.userAvatar = '🐥'; this.userName = '';
        this.isWon = false; this.startTime = 0;
        this.records = JSON.parse(localStorage.getItem('starry_lb')) || [];

        this.init();
    }

    init() {
        window.addEventListener('resize', () => this.resize());
        this.resize();
        this.createBg();
        this.canvas.addEventListener('mousedown', (e) => this.handleInput(e));
        this.canvas.addEventListener('touchstart', (e) => { e.preventDefault(); this.handleInput(e.touches[0]); }, {passive:false});
        this.updateLB();
        this.animate();
    }

    resize() {
        this.canvas.width = this.bgCanvas.width = window.innerWidth;
        this.canvas.height = this.bgCanvas.height = window.innerHeight;
    }

    createBg() {
        for(let i=0; i<40; i++) {
            this.bgStars.push({
                x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight,
                s: Math.random()*20 + 10, v: Math.random()*0.5 + 0.2,
                angle: Math.random() * Math.PI * 2
            });
        }
    }

    initSession() {
        const name = document.getElementById('user-name').value.trim();
        if(!name) return alert("Cho mình biết tên bạn đã!");
        this.userName = name;
        document.getElementById('start-screen').style.display = 'none';
        this.generateLevel();
    }

    generateLevel() {
        this.nodes = []; this.edges = []; this.path = []; this.isWon = false;
        this.startTime = Date.now();
        document.getElementById('win-screen').style.display = 'none';
        document.getElementById('lvl').innerText = this.level;

        // Khó dần: Số điểm = level + 3
        const count = this.level + 3;
        const margin = 100;

        for(let i=0; i<count; i++) {
            let x, y, ok = false;
            while(!ok) {
                x = margin + Math.random() * (this.canvas.width - margin*2);
                y = margin + 50 + Math.random() * (this.canvas.height - margin*3);
                // Đảm bảo các cạnh không sát nhau (khoảng cách tối thiểu 110px)
                ok = this.nodes.every(n => Math.hypot(n.x - x, n.y - y) > 110);
            }
            this.nodes.push({id: i, x, y, baseX: x, baseY: y, phase: Math.random()*Math.PI});
        }

        // Tạo lời giải Hamilton
        const sol = [...Array(count).keys()].sort(() => Math.random() - 0.5);
        for(let i=0; i<count-1; i++) this.edges.push([sol[i], sol[i+1]]);
        
        // Thêm cạnh nhiễu (Khó hơn theo level)
        for(let i=0; i < count * (0.5 + this.level/5); i++) {
            const a = Math.floor(Math.random()*count), b = Math.floor(Math.random()*count);
            if(a !== b && !this.edges.some(e => e.includes(a) && e.includes(b))) {
                this.edges.push([a, b]);
            }
        }
    }

    handleInput(pos) {
        if(this.isWon) return;
        const rect = this.canvas.getBoundingClientRect();
        const x = pos.clientX - rect.left;
        const y = pos.clientY - rect.top;
        this.nodes.forEach(n => {
            if(Math.hypot(n.x - x, n.y - y) < 40) this.selectNode(n.id);
        });
    }

    selectNode(id) {
        if(this.path.includes(id)) {
            if(this.path[this.path.length-1] === id) { this.path.pop(); Sound.playClick(); }
            return;
        }
        const last = this.path[this.path.length-1];
        if(this.path.length === 0 || this.edges.some(e => e.includes(last) && e.includes(id))) {
            this.path.push(id);
            Sound.playClick();
            this.burst(this.nodes[id].x, this.nodes[id].y);
            if(this.path.length === this.nodes.length) this.win();
        }
    }

    burst(x, y) {
        for(let i=0; i<10; i++) {
            this.starsBurst.push({
                x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                life: 1, s: Math.random()*15+5
            });
        }
    }

    win() {
        this.isWon = true;
        const time = Math.floor((Date.now() - this.startTime)/1000);
        Sound.playWin();
        
        // Save record (local for now, needs Firebase for cross-device)
        this.records.push({name: this.userName, avatar: this.userAvatar, time, level: this.level, date: new Date().toLocaleDateString()});
        this.records.sort((a,b) => b.level - a.level || a.time - b.time);
        this.records = this.records.slice(0, 10);
        localStorage.setItem('starry_lb', JSON.stringify(this.records));
        this.updateLB();

        document.getElementById('win-msg').innerText = `Màn ${this.level} - ${time} giây`;
        document.getElementById('win-screen').style.display = 'flex';
    }

    updateLB() {
        const content = document.getElementById('lb-content');
        content.innerHTML = '';
        const today = new Date().toLocaleDateString();
        // Lọc kỷ lục theo ngày (daily)
        const daily = this.records.filter(r => r.date === today);
        daily.forEach((r, i) => {
            content.innerHTML += `<div class="lb-item"><b>${i+1}.</b> ${r.avatar} ${r.name} <span style="margin-left:auto">LV${r.level} - ${r.time}s</span></div>`;
        });
    }

    undo() { this.path.pop(); }
    restart() { this.path = []; this.startTime = Date.now(); }
    nextLevel() { this.level++; this.generateLevel(); }

    animate() {
        // 1. Draw Background (Starry Night style)
        this.bgCtx.clearRect(0,0,this.bgCanvas.width, this.bgCanvas.height);
        this.bgStars.forEach(s => {
            this.bgCtx.font = `${s.s}px serif`;
            this.bgCtx.fillText("⭐", s.x, s.y);
            s.y += s.v; s.x += Math.sin(s.angle)*0.5;
            s.angle += 0.02;
            if(s.y > window.innerHeight) s.y = -20;
        });

        // 2. Draw Game
        this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
        
        // Cạnh
        this.ctx.strokeStyle = '#d7ccc8'; this.ctx.lineWidth = 3;
        this.edges.forEach(e => {
            this.ctx.beginPath(); this.ctx.moveTo(this.nodes[e[0]].x, this.nodes[e[0]].y);
            this.ctx.lineTo(this.nodes[e[1]].x, this.nodes[e[1]].y); this.ctx.stroke();
        });

        // Đường đã đi
        if(this.path.length > 1) {
            this.ctx.strokeStyle = '#f39c12'; this.ctx.lineWidth = 10; this.ctx.lineCap = 'round';
            this.ctx.beginPath();
            this.path.forEach((id, i) => {
                const n = this.nodes[id];
                if(i===0) this.ctx.moveTo(n.x, n.y); else this.ctx.lineTo(n.x, n.y);
            });
            this.ctx.stroke();
        }

        // Nút (Ngôi sao lớn nhấp nhô)
        this.nodes.forEach(n => {
            const active = this.path.includes(n.id);
            const isLast = this.path[this.path.length-1] === n.id;
            const float = Math.sin(Date.now()*0.003 + n.phase)*5;
            n.y = n.baseY + float;

            this.ctx.fillStyle = active ? '#f39c12' : '#fff';
            this.ctx.strokeStyle = '#f39c12'; this.ctx.lineWidth = 4;
            this.ctx.beginPath(); this.ctx.arc(n.x, n.y, isLast?22:18, 0, Math.PI*2);
            this.ctx.fill(); this.ctx.stroke();
            if(active) {
                this.ctx.fillStyle = "white"; this.ctx.font = "16px serif";
                this.ctx.fillText("✨", n.x-10, n.y+5);
            }
        });

        // Burst Stars
        this.starsBurst.forEach((s, i) => {
            this.ctx.globalAlpha = s.life;
            this.ctx.font = `${s.s}px serif`;
            this.ctx.fillText("⭐", s.x, s.y);
            s.x += s.vx; s.y += s.vy; s.life -= 0.03;
            if(s.life <= 0) this.starsBurst.splice(i, 1);
        });
        this.ctx.globalAlpha = 1;

        if(!this.isWon && this.startTime > 0) {
            document.getElementById('timer').innerText = Math.floor((Date.now() - this.startTime)/1000);
            document.getElementById('mascot').style.transform = `scale(${1 + Math.sin(Date.now()*0.01)*0.1})`;
        }

        requestAnimationFrame(() => this.animate());
    }
}

const game = new HamiltonStarry();
</script>
</body>
</html>
