<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starry Hamilton - Premium Edition</title>
    <!-- Google Fonts hỗ trợ tiếng Việt hoàn hảo -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-primary: #f1c40f;
            --gold-light: #f39c12;
            --gold-glow: rgba(241, 196, 15, 0.5);
            --dark-bg: #0a0e14;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-main: 'Lexend', sans-serif;
            --emoji-font: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: var(--dark-bg);
            font-family: var(--font-main);
            color: white;
        }

        #game-canvas { position: absolute; top: 0; left: 0; z-index: 1; cursor: crosshair; }

        /* Giao diện lớp phủ (Overlay) */
        .overlay {
            position: fixed; inset: 0; z-index: 100;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            transition: all 0.5s ease;
        }

        .modal {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 30px; border-radius: 24px;
            width: 90%; max-width: 450px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 { color: var(--gold-primary); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px; font-weight: 800; }

        input[type="text"] {
            background: rgba(255,255,255,0.1); border: 1px solid var(--gold-primary);
            padding: 12px 20px; border-radius: 12px; color: white; width: 100%;
            margin-bottom: 20px; text-align: center; font-family: var(--font-main);
        }

        .avatar-grid { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .avatar-item {
            font-size: 30px; cursor: pointer; padding: 10px; border-radius: 12px;
            border: 2px solid transparent; transition: 0.3s; font-family: var(--emoji-font);
        }
        .avatar-item.selected { border-color: var(--gold-primary); background: var(--gold-glow); transform: scale(1.1); }

        .btn {
            background: var(--gold-primary); color: #000; border: none;
            padding: 15px 30px; border-radius: 50px; font-weight: 700;
            cursor: pointer; text-transform: uppercase; transition: 0.3s; width: 100%;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px var(--gold-glow); }

        /* HUD - Hiển thị trong game */
        #hud {
            position: absolute; top: 20px; left: 0; width: 100%;
            padding: 0 20px; z-index: 10; pointer-events: none;
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .hud-group { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .hud-box {
            background: var(--glass); border: 1px solid var(--glass-border);
            padding: 8px 15px; border-radius: 15px; backdrop-filter: blur(5px);
            display: flex; align-items: center; gap: 10px; font-size: 14px;
        }

        .duck-cheer {
            display: flex; align-items: center; gap: 8px;
            background: rgba(241, 196, 15, 0.15); border: 1px solid var(--gold-primary);
            padding: 5px 12px; border-radius: 20px; animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 10; }
        .ctrl-btn {
            width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--glass-border);
            background: var(--glass); color: white; cursor: pointer; backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; font-size: 20px;
        }
        .ctrl-btn:hover { background: var(--gold-primary); color: black; }

        .hidden { display: none !important; }

        /* Bảng xếp hạng */
        .leaderboard-list { text-align: left; margin: 15px 0; max-height: 200px; overflow-y: auto; }
        .lb-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--glass-border); }

    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <!-- Màn hình chào -->
    <div id="start-overlay" class="overlay">
        <div class="modal">
            <h1>Starry Hamilton</h1>
            <input type="text" id="player-name" placeholder="Nhập tên của bạn..." maxlength="15">
            <div class="avatar-grid" id="avatar-selector"></div>
            <div style="margin-bottom: 20px; font-size: 13px; color: #aaa; line-height: 1.6;">
                Nối tất cả các ngôi sao bằng một đường đi duy nhất.<br>
                Không đi qua một điểm hai lần. Chúc bạn may mắn!
            </div>
            <button class="btn" onclick="startGame()">Bắt Đầu</button>
            <button class="btn" style="margin-top: 10px; background: transparent; color: var(--gold-primary); border: 1px solid var(--gold-primary);" onclick="showLeaderboard()">Bảng Xếp Hạng</button>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="hud-group">
            <div class="hud-box">
                <span id="display-avatar" style="font-family: var(--emoji-font)">🚀</span>
                <span id="display-name" style="font-weight: 600;">Người chơi</span>
            </div>
            <div class="hud-box">
                Màn: <span id="current-level" style="color: var(--gold-primary); font-weight: 800;">1</span>
            </div>
        </div>

        <div class="hud-group" style="align-items: flex-end;">
            <div class="hud-box">
                ⏱️ <span id="timer">00:00</span>
            </div>
            <div class="duck-cheer">
                <span style="font-size: 24px;">🦆</span>
                <span id="cheer-text" style="font-size: 11px; font-weight: 600;">Cố lên bạn ơi!</span>
            </div>
        </div>
    </div>

    <!-- Điều khiển -->
    <div id="controls" class="controls hidden">
        <button class="ctrl-btn" onclick="undo()" title="Hoàn tác">↩</button>
        <button class="ctrl-btn" onclick="restartLevel()" title="Chơi lại">↺</button>
        <button class="ctrl-btn" onclick="showAnswer()" title="Gợi ý">💡</button>
    </div>

    <!-- Modal thắng màn -->
    <div id="win-overlay" class="overlay hidden">
        <div class="modal">
            <h1 style="color: #4cd137;">Tuyệt vời!</h1>
            <p id="win-msg">Bạn đã kết nối thành công chòm sao.</p>
            <button class="btn" style="margin-top: 20px;" onclick="nextLevel()">Màn Tiếp Theo</button>
        </div>
    </div>

    <!-- Modal Bảng xếp hạng -->
    <div id="lb-overlay" class="overlay hidden">
        <div class="modal">
            <h1>Top Cao Thủ</h1>
            <div class="leaderboard-list" id="lb-content"></div>
            <button class="btn" onclick="hideLeaderboard()">Đóng</button>
        </div>
    </div>

    <script>
        // --- KHỞI TẠO BIẾN TOÀN CỤC ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        let player = { name: "Ẩn danh", avatar: "🚀", level: 1, time: 0 };
        let gameState = "START";
        let stars = [], shootingStars = [], effects = [];
        let graph = { nodes: [], edges: [], solution: [] };
        let currentPath = [];
        let timerInterval;
        let isAnswering = false;

        const cheers = ["Cố lên bạn ơi!", "Bạn làm được mà!", "Sắp xong rồi!", "Đỉnh quá!", "Tiếp tục nào!", "Quá nhanh luôn!"];
        const avatars = ["🚀", "🛸", "🐱", "🐶", "🦊", "🤖", "👾", "⭐"];

        // --- HỆ THỐNG ÂM THANH (Dùng AudioContext để chuyên nghiệp hơn) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type = 'sine', duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playWinSound() {
            [440, 554, 659, 880].forEach((f, i) => {
                setTimeout(() => playSound(f, 'triangle', 0.3), i * 150);
            });
        }

        // --- CẤU TRÚC NỀN TRỜI ---
        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2;
                this.blink = Math.random() * Math.PI;
                this.speed = 0.02 + Math.random() * 0.05;
                this.rotate = Math.random() * Math.PI * 2;
            }
            update() {
                this.blink += this.speed;
                this.rotate += 0.01;
            }
            draw() {
                let opacity = 0.3 + Math.abs(Math.sin(this.blink)) * 0.7;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotate);
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                // Vẽ sao 4 cánh xoay
                for(let i=0; i<2; i++) {
                    ctx.rotate(Math.PI/2);
                    ctx.fillRect(-this.size*2, -0.5, this.size*4, 1);
                }
                ctx.restore();
            }
        }

        class ShootingStar {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = -20;
                this.len = 50 + Math.random() * 100;
                this.speed = 10 + Math.random() * 15;
                this.active = Math.random() > 0.995;
            }
            update() {
                if(this.active) {
                    this.x -= this.speed;
                    this.y += this.speed;
                    if(this.x < -200 || this.y > height + 200) this.reset();
                } else if(Math.random() > 0.998) this.active = true;
            }
            draw() {
                if(!this.active) return;
                let grad = ctx.createLinearGradient(this.x, this.y, this.x + this.len, this.y - this.len);
                grad.addColorStop(0, "white");
                grad.addColorStop(1, "transparent");
                ctx.strokeStyle = grad;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + this.len, this.y - this.len);
                ctx.stroke();
            }
        }

        // --- LOGIC GAME CHÍNH ---
        function initStars() {
            stars = Array.from({length: 150}, () => new Star());
            shootingStars = Array.from({length: 3}, () => new ShootingStar());
        }

        function createGraph(level) {
            const nodeCount = 4 + Math.floor(level / 2);
            const nodes = [];
            const padding = 80;
            
            // Sinh điểm đảm bảo khoảng cách
            for(let i=0; i<nodeCount; i++) {
                let attempts = 0;
                while(attempts < 100) {
                    let n = {
                        x: padding + Math.random() * (width - padding * 2),
                        y: padding + 50 + Math.random() * (height - padding * 3),
                        id: i
                    };
                    if(nodes.every(other => Math.hypot(n.x - other.x, n.y - other.y) > 100)) {
                        nodes.push(n);
                        break;
                    }
                    attempts++;
                }
            }

            // Tạo chu trình Hamilton giả lập để luôn có nghiệm
            let solution = [...Array(nodes.length).keys()].sort(() => Math.random() - 0.5);
            let edges = [];
            for(let i=0; i<solution.length - 1; i++) {
                edges.push([solution[i], solution[i+1]]);
            }

            // Thêm các cạnh nhiễu (không quá sát)
            nodes.forEach(n => {
                nodes.forEach(m => {
                    if(n.id !== m.id && Math.random() > 0.7) {
                        if(!edges.some(e => (e[0]==n.id && e[1]==m.id) || (e[1]==n.id && e[0]==m.id))) {
                            edges.push([n.id, m.id]);
                        }
                    }
                });
            });

            return { nodes, edges, solution };
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        }

        window.addEventListener('resize', resize);
        resize();

        // --- GIAO DIỆN CHỌN AVATAR ---
        const selector = document.getElementById('avatar-selector');
        avatars.forEach(a => {
            let div = document.createElement('div');
            div.className = 'avatar-item';
            div.innerText = a;
            div.onclick = () => {
                document.querySelectorAll('.avatar-item').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                player.avatar = a;
            };
            selector.appendChild(div);
        });
        selector.firstChild.classList.add('selected');

        // --- HÀNH ĐỘNG ---
        function startGame() {
            let nameInput = document.getElementById('player-name').value;
            if(nameInput) player.name = nameInput;
            
            document.getElementById('start-overlay').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            
            document.getElementById('display-name').innerText = player.name;
            document.getElementById('display-avatar').innerText = player.avatar;
            
            startLevel(1);
            startTimer();
            gameState = "PLAYING";
        }

        function startLevel(lv) {
            player.level = lv;
            isAnswering = false;
            document.getElementById('current-level').innerText = lv;
            graph = createGraph(lv);
            currentPath = [];
            effects = [];
            document.getElementById('cheer-text').innerText = cheers[Math.floor(Math.random()*cheers.length)];
        }

        function startTimer() {
            let start = Date.now();
            timerInterval = setInterval(() => {
                let diff = Date.now() - start;
                let m = Math.floor(diff / 60000).toString().padStart(2, '0');
                let s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
                player.time = diff;
            }, 1000);
        }

        // --- XỬ LÝ CLICK / TOUCH ---
        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(e.touches[0]); });

        function handleInput(e) {
            if(gameState !== "PLAYING") return;
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Hiệu ứng tỏa sao khi click
            createExplosion(mouseX, mouseY, var(--gold-primary), 10);
            playSound(200, 'sine', 0.05);

            const clickedNode = graph.nodes.find(n => Math.hypot(n.x - mouseX, n.y - mouseY) < 30);
            
            if(clickedNode) {
                if(currentPath.length === 0) {
                    currentPath.push(clickedNode.id);
                    playSound(440);
                } else {
                    const lastId = currentPath[currentPath.length - 1];
                    // Kiểm tra xem có cạnh nối không
                    const hasEdge = graph.edges.some(edge => 
                        (edge[0] === lastId && edge[1] === clickedNode.id) || 
                        (edge[1] === lastId && edge[0] === clickedNode.id)
                    );
                    
                    if(hasEdge && !currentPath.includes(clickedNode.id)) {
                        currentPath.push(clickedNode.id);
                        playSound(440 + currentPath.length * 50);
                        if(currentPath.length === graph.nodes.length) {
                            win();
                        }
                    } else if(currentPath.includes(clickedNode.id)) {
                        // Rung hoặc báo lỗi nhẹ
                        createExplosion(mouseX, mouseY, '#ff4757', 5);
                    }
                }
            }
        }

        function createExplosion(x, y, color, count) {
            for(let i=0; i<count; i++) {
                effects.push({
                    x, y, 
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function win() {
            gameState = "WIN";
            playWinSound();
            createPaperEffect();
            document.getElementById('win-overlay').classList.remove('hidden');
            saveScore();
        }

        function createPaperEffect() {
            for(let i=0; i<100; i++) {
                effects.push({
                    x: Math.random() * width,
                    y: -20,
                    vx: (Math.random() - 0.5) * 4,
                    vy: 2 + Math.random() * 5,
                    life: 2.0,
                    color: `hsl(${Math.random()*360}, 70%, 60%)`,
                    isPaper: true,
                    size: Math.random() * 10 + 5,
                    rot: Math.random() * Math.PI
                });
            }
        }

        function nextLevel() {
            document.getElementById('win-overlay').classList.add('hidden');
            gameState = "PLAYING";
            startLevel(player.level + 1);
        }

        function undo() { if(currentPath.length > 0) currentPath.pop(); }
        function restartLevel() { currentPath = []; }
        function showAnswer() { 
            isAnswering = true; 
            currentPath = [];
            let i = 0;
            const interval = setInterval(() => {
                if(i < graph.solution.length) {
                    currentPath.push(graph.solution[i]);
                    playSound(600 + i*20);
                    i++;
                } else {
                    clearInterval(interval);
                    setTimeout(win, 500);
                }
            }, 300);
        }

        // --- BXH LOCALSTORAGE ---
        function saveScore() {
            let scores = JSON.parse(localStorage.getItem('hamilton_scores') || '[]');
            scores.push({name: player.name, level: player.level, avatar: player.avatar});
            scores.sort((a,b) => b.level - a.level);
            localStorage.setItem('hamilton_scores', JSON.stringify(scores.slice(0, 10)));
        }

        function showLeaderboard() {
            const list = document.getElementById('lb-content');
            let scores = JSON.parse(localStorage.getItem('hamilton_scores') || '[]');
            list.innerHTML = scores.length ? scores.map((s, i) => `
                <div class="lb-item">
                    <span>${i+1}. ${s.avatar} ${s.name}</span>
                    <span style="color:var(--gold-primary)">Màn ${s.level}</span>
                </div>
            `).join('') : '<p>Chưa có dữ liệu</p>';
            document.getElementById('lb-overlay').classList.remove('hidden');
        }

        function hideLeaderboard() { document.getElementById('lb-overlay').classList.add('hidden'); }

        // --- VÒNG LẶP RENDER ---
        function draw() {
            ctx.fillStyle = var(--dark-bg);
            ctx.fillRect(0, 0, width, height);

            stars.forEach(s => { s.update(); s.draw(); });
            shootingStars.forEach(s => { s.update(); s.draw(); });

            // Vẽ cạnh
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = "rgba(255,255,255,0.1)";
            graph.edges.forEach(e => {
                const n1 = graph.nodes[e[0]];
                const n2 = graph.nodes[e[1]];
                ctx.beginPath();
                ctx.moveTo(n1.x, n1.y);
                ctx.lineTo(n2.x, n2.y);
                ctx.stroke();
            });
            ctx.setLineDash([]);

            // Vẽ đường đang đi
            if(currentPath.length > 0) {
                ctx.lineWidth = 6;
                ctx.strokeStyle = var(--gold-primary);
                ctx.shadowBlur = 15;
                ctx.shadowColor = var(--gold-primary);
                ctx.beginPath();
                const start = graph.nodes[currentPath[0]];
                ctx.moveTo(start.x, start.y);
                for(let i=1; i<currentPath.length; i++) {
                    const next = graph.nodes[currentPath[i]];
                    ctx.lineTo(next.x, next.y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Vẽ điểm
            graph.nodes.forEach(n => {
                const isActive = currentPath.includes(n.id);
                const isLast = currentPath[currentPath.length - 1] === n.id;
                
                ctx.beginPath();
                ctx.arc(n.x, n.y, isLast ? 12 : 8, 0, Math.PI*2);
                ctx.fillStyle = isActive ? var(--gold-primary) : "white";
                if(isLast) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = var(--gold-primary);
                }
                ctx.fill();
                ctx.shadowBlur = 0;

                // Vẽ Avatar tại điểm hiện tại
                if(isLast && gameState === "PLAYING") {
                    ctx.font = `30px ${GameApp ? 'var(--emoji-font)' : 'serif'}`; // Fallback font safety
                    ctx.textAlign = "center";
                    ctx.fillText(player.avatar, n.x, n.y - 30);
                }
            });

            // Hiệu ứng hạt
            for(let i = effects.length - 1; i >= 0; i--) {
                let p = effects[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.02;
                if(p.life <= 0) { effects.splice(i, 1); continue; }

                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                if(p.isPaper) {
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot + p.life);
                    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size/2);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.restore();
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
