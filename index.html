<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hamilton Game</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background: radial-gradient(circle,#0b0b2a,#000);
  color:white;
  text-align:center;
  font-family:sans-serif;
}

h1{
  color:#caa6ff;
  text-shadow:0 0 20px #caa6ff;
}

/* CANVAS */
canvas{
  display:block;
  margin:auto;
  border-radius:12px;
  box-shadow:0 0 40px rgba(150,100,255,0.3);
}

/* BUTTON */
button{
  padding:10px 15px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#caa6ff;
  cursor:pointer;
}

/* WIN POPUP */
#winBox{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  background:rgba(0,0,0,0.8);
  padding:30px;
  border-radius:16px;
  box-shadow:0 0 40px #caa6ff;
  transition:0.3s;
}

#winBox.show{
  transform:translate(-50%,-50%) scale(1);
}

</style>
</head>

<body>

<h1>🌙 Hamilton Game</h1>

Level: <span id="level">1</span> |
Time: <span id="time">0</span>s
<br>

<button onclick="undo()">Undo</button>
<button onclick="restart()">Restart</button>

<canvas id="game" width="500" height="500"></canvas>

<!-- WIN UI -->
<div id="winBox">
  <h2>✨ You Win!</h2>
  <p id="timeResult"></p>
  <button onclick="nextLevel()">Next Level</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let graph,path=[],level=1;
let startTime, timerInterval;

/* ===== TIMER ===== */
function startTimer(){
  startTime=Date.now();
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    let t=Math.floor((Date.now()-startTime)/1000);
    document.getElementById("time").innerText=t;
  },200);
}

/* ===== STAR BG ===== */
let stars=[];
for(let i=0;i<100;i++){
  stars.push({x:Math.random()*500,y:Math.random()*500,a:Math.random()});
}

/* ===== SHOOTING STAR ===== */
let meteors=[];
function spawnMeteor(){
  meteors.push({
    x:Math.random()*500,
    y:0,
    vx:4+Math.random()*2,
    vy:4+Math.random()*2,
    life:1
  });
}

/* ===== GRAPH ===== */
class Graph{
  constructor(n){
    this.nodes=[];
    this.edges={};

    const MIN=0.18;

    for(let i=0;i<n;i++){
      let x,y,tries=0;
      do{
        x=0.1+Math.random()*0.8;
        y=0.1+Math.random()*0.8;
        tries++;
      }while(!this.ok(x,y,MIN)&&tries<100);

      this.nodes.push({
        id:i,x,y,
        color:`hsl(${Math.random()*360},100%,70%)`
      });

      this.edges[i]=[];
    }

    for(let i=0;i<n-1;i++) this.link(i,i+1);

    for(let i=0;i<n;i++){
      for(let j=i+2;j<n;j++){
        if(Math.random()<0.3) this.link(i,j);
      }
    }
  }

  ok(x,y,min){
    return this.nodes.every(n=>{
      return Math.hypot(n.x-x,n.y-y)>min;
    });
  }

  link(a,b){
    this.edges[a].push(b);
    this.edges[b].push(a);
  }

  isConnected(a,b){
    return this.edges[a].includes(b);
  }
}

/* ===== DRAW ===== */
function draw(){
  ctx.clearRect(0,0,500,500);

  // stars
  stars.forEach(s=>{
    ctx.fillStyle=`rgba(255,255,255,${s.a})`;
    ctx.fillRect(s.x,s.y,2,2);
    s.a+= (Math.random()-0.5)*0.02;
  });

  // meteors
  meteors.forEach(m=>{
    ctx.strokeStyle="white";
    ctx.beginPath();
    ctx.moveTo(m.x,m.y);
    ctx.lineTo(m.x-20,m.y-20);
    ctx.stroke();

    m.x+=m.vx;
    m.y+=m.vy;
    m.life-=0.02;
  });

  meteors=meteors.filter(m=>m.life>0);
  if(Math.random()<0.01) spawnMeteor();

  // edges
  for(let a in graph.edges){
    for(let b of graph.edges[a]){
      let A=graph.nodes[a],B=graph.nodes[b];
      ctx.strokeStyle="rgba(255,255,255,0.1)";
      ctx.beginPath();
      ctx.moveTo(A.x*500,A.y*500);
      ctx.lineTo(B.x*500,B.y*500);
      ctx.stroke();
    }
  }

  // path
  ctx.lineWidth=4;
  ctx.shadowBlur=20;

  for(let i=0;i<path.length-1;i++){
    let A=graph.nodes[path[i]];
    let B=graph.nodes[path[i+1]];
    ctx.strokeStyle=A.color;
    ctx.shadowColor=A.color;

    ctx.beginPath();
    ctx.moveTo(A.x*500,A.y*500);
    ctx.lineTo(B.x*500,B.y*500);
    ctx.stroke();
  }

  ctx.shadowBlur=0;

  // nodes
  graph.nodes.forEach(n=>{
    ctx.beginPath();
    ctx.arc(n.x*500,n.y*500,10,0,Math.PI*2);

    ctx.fillStyle=path.includes(n.id)?n.color:"#fff";
    ctx.shadowBlur=15;
    ctx.shadowColor=n.color;
    ctx.fill();
    ctx.shadowBlur=0;
  });
}

/* ===== LOOP ===== */
function loop(){
  draw();
  requestAnimationFrame(loop);
}

/* ===== CLICK ===== */
canvas.onclick=e=>{
  let rect=canvas.getBoundingClientRect();
  let x=(e.clientX-rect.left)/rect.width;
  let y=(e.clientY-rect.top)/rect.height;

  let nearest=null,min=0.05;

  graph.nodes.forEach(n=>{
    let d=Math.hypot(n.x-x,n.y-y);
    if(d<min){min=d;nearest=n.id;}
  });

  if(nearest==null) return;

  if(path.length==0 || graph.isConnected(path[path.length-1],nearest)){
    if(!path.includes(nearest)){
      path.push(nearest);

      if(path.length===graph.nodes.length){
        win();
      }
    }
  }
};

/* ===== WIN ===== */
function win(){
  clearInterval(timerInterval);

  let timeUsed=Math.floor((Date.now()-startTime)/1000);

  document.getElementById("timeResult").innerText =
    "Completed in "+timeUsed+" seconds";

  document.getElementById("winBox").classList.add("show");

  saveScore(timeUsed);
}

/* ===== SAVE ===== */
function saveScore(t){
  let data=JSON.parse(localStorage.getItem("scores")||"[]");
  data.push({level,time:t});
  localStorage.setItem("scores",JSON.stringify(data));
}

/* ===== NEXT LEVEL ===== */
function nextLevel(){
  document.getElementById("winBox").classList.remove("show");
  level++;
  start();
}

/* ===== SYSTEM ===== */
function undo(){ path.pop(); }
function restart(){ path=[]; startTimer(); }

function start(){
  document.getElementById("level").innerText=level;
  graph=new Graph(4+level);
  path=[];
  startTimer();
}

/* ===== INIT ===== */
start();
loop();

</script>

</body>
</html>
