<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starry Hamilton - Bản Nâng Cấp</title>
    <style>
        /* ==========================================================================
           CSS KIẾN TRÚC & UI MỚI (TỐI ƯU FONT TIẾNG VIỆT)
           ========================================================================== */
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap');

        :root {
            --bg-deep: #0a0e17;
            --bg-glow: #1a233a;
            --primary: #f6e58d;
            --primary-hover: #f9ca24;
            --accent: #686de0;
            --text-main: #ffffff;
            --text-dim: #95afc0;
            --glass-bg: rgba(20, 25, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-main: 'Lexend', sans-serif;
            --z-bg: 1; --z-canvas: 2; --z-hud: 10; --z-modal: 100;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: var(--font-main);
            margin: 0; padding: 0;
        }

        body, html {
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, var(--bg-glow) 0%, var(--bg-deep) 100%);
            overflow: hidden;
            touch-action: none; /* Chống cuộn trang trên mobile */
            color: var(--text-main);
        }

        /* Canvas Game */
        #game-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: var(--z-canvas);
        }

        /* Các lớp UI dùng chung (Glassmorphism) */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        /* Giao diện Overlay (Modals) */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: var(--z-modal);
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal-content {
            width: 90%;
            max-width: 450px;
            padding: 30px;
            text-align: center;
            transform: scale(1);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .overlay.hidden .modal-content {
            transform: scale(0.8);
        }

        h1.title {
            color: var(--primary);
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(246, 229, 141, 0.5);
        }

        .rules {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .rules strong { color: var(--text-main); }

        /* Vùng chọn Avatar - Đã sửa lỗi */
        .avatar-section {
            margin-bottom: 25px;
        }
        .avatar-section h3 {
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: 400;
        }
        .avatar-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .avatar-btn {
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            font-size: 32px;
            width: 60px; height: 60px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; /* Chống lỗi ô vuông */
        }
        .avatar-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-3px);
        }
        .avatar-btn.selected {
            border-color: var(--primary);
            background: rgba(246, 229, 141, 0.2);
            box-shadow: 0 0 15px rgba(246, 229, 141, 0.4);
            transform: scale(1.1);
        }

        /* Nút chung */
        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(246, 229, 141, 0.3);
        }
        .btn:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(246, 229, 141, 0.5);
        }
        .btn:active { transform: scale(0.95); }

        /* HUD - Thanh công cụ trong game */
        #hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: var(--z-hud);
            pointer-events: none; /* Xuyên qua HUD để click Canvas */
        }
        .hud-left, .hud-right {
            display: flex;
            gap: 15px;
            pointer-events: auto; /* Cho phép click các nút trên HUD */
        }
        .hud-pill {
            padding: 10px 20px;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-icon {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            width: 45px; height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.2); }

        /* Thông báo nổi (Toast) */
        #toast-container {
            position: absolute;
            top: 80px; left: 50%;
            transform: translateX(-50%);
            z-index: var(--z-modal);
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: var(--accent);
            color: white;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: 600;
            animation: slideDown 0.3s ease-out forwards, fadeOut 0.5s ease-in 2s forwards;
            box-shadow: 0 4px 15px rgba(104, 109, 224, 0.4);
        }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

    </style>
</head>
<body>

    <!-- Vùng vẽ chính -->
    <canvas id="game-canvas"></canvas>

    <!-- HUD trong game -->
    <div id="hud" class="hidden" style="opacity: 0; transition: opacity 0.5s;">
        <div class="hud-left">
            <div class="glass-panel hud-pill" id="level-display">
                <span id="player-avatar-hud">🚀</span> Màn <span id="current-level">1</span>
            </div>
        </div>
        <div class="hud-right">
            <button class="btn-icon" id="btn-undo" title="Hoàn tác">↩</button>
            <button class="btn-icon" id="btn-restart" title="Chơi lại màn">↺</button>
        </div>
    </div>

    <!-- Thông báo nổi -->
    <div id="toast-container"></div>

    <!-- Modal Màn hình chính -->
    <div id="start-modal" class="overlay">
        <div class="glass-panel modal-content">
            <h1 class="title">Starry Hamilton</h1>
            <p class="rules">
                Nhiệm vụ: Nối tất cả các vì sao để tạo thành chòm sao.<br>
                <strong>Quy tắc:</strong> Đi qua TẤT CẢ các điểm, và KHÔNG ĐƯỢC lặp lại đường cũ hoặc cắt chéo đường.
            </p>
            
            <div class="avatar-section">
                <h3>Chọn Avatar Của Bạn</h3>
                <div class="avatar-grid" id="avatar-container">
                    <!-- JS sẽ sinh ra các nút avatar ở đây -->
                </div>
            </div>

            <button class="btn" id="btn-start-game">Bắt Đầu Hành Trình</button>
        </div>
    </div>

    <!-- Modal Thắng Cảnh -->
    <div id="win-modal" class="overlay hidden">
        <div class="glass-panel modal-content">
            <h1 class="title" style="color: #4cd137;">Hoàn Thành!</h1>
            <p class="rules">Chòm sao tuyệt đẹp đã được kết nối.</p>
            <button class="btn" id="btn-next-level">Sang Màn Tiếp Theo</button>
        </div>
    </div>

    <script>
        /* ==========================================================================
           CORE GAME ENGINE - PHIÊN BẢN SUPER NÂNG CẤP (>800 DÒNG TỔNG THỂ)
           Kiến trúc Modules: Config, Utils, Audio, Particles, Graph, App
           ========================================================================== */
        
        const GameApp = {};

        // 1. Cấu hình hằng số
        GameApp.Config = {
            BASE_NODES: 4,
            MAX_LEVEL: 50,
            NODE_RADIUS: 18,
            CONNECTION_WIDTH: 6,
            COLOR_NODE_DEFAULT: '#95afc0',
            COLOR_NODE_ACTIVE: '#f6e58d',
            COLOR_NODE_VISITED: '#686de0',
            COLOR_LINE_DEFAULT: 'rgba(255, 255, 255, 0.15)',
            COLOR_LINE_ACTIVE: '#f1c40f',
            AVATARS: ['🚀', '🛸', '🐱', '🐶', '🦊', '🐼', '🤖', '👾'],
            FONTS: {
                UI: "'Lexend', sans-serif",
                EMOJI: "'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif"
            }
        };

        // 2. Tiện ích (Toán học, Màu sắc)
        GameApp.Utils = {
            distance: (p1, p2) => Math.hypot(p2.x - p1.x, p2.y - p1.y),
            random: (min, max) => Math.random() * (max - min) + min,
            randomInt: (min, max) => Math.floor(Math.random() * (max - min + 1)) + min,
            // Thuật toán kiểm tra 2 đoạn thẳng giao nhau (Cắt chéo)
            linesIntersect: (a, b, c, d) => {
                const ccw = (A, B, C) => (C.y - A.y) * (B.x - A.x) > (B.y - A.y) * (C.x - A.x);
                return (ccw(a, c, d) !== ccw(b, c, d)) && (ccw(a, b, c) !== ccw(a, b, d));
            }
        };

        // 3. Hệ thống Hạt (Particles) tạo hiệu ứng lấp lánh không gian
        GameApp.Particles = class {
            constructor(ctx, w, h) {
                this.ctx = ctx; this.w = w; this.h = h;
                this.stars = [];
                this.sparks = [];
                for(let i=0; i<100; i++) this.stars.push(this.createStar());
            }
            createStar() {
                return {
                    x: Math.random() * this.w, y: Math.random() * this.h,
                    r: Math.random() * 2, alpha: Math.random(),
                    speed: Math.random() * 0.02
                };
            }
            addSpark(x, y) {
                for(let i=0; i<15; i++) {
                    this.sparks.push({
                        x: x, y: y,
                        vx: GameApp.Utils.random(-3, 3), vy: GameApp.Utils.random(-3, 3),
                        life: 1.0, decay: GameApp.Utils.random(0.02, 0.05),
                        color: GameApp.Config.COLOR_NODE_ACTIVE
                    });
                }
            }
            updateAndDraw() {
                // Vẽ sao nền
                this.ctx.fillStyle = 'white';
                this.stars.forEach(star => {
                    star.alpha += star.speed;
                    if(star.alpha > 1 || star.alpha < 0) star.speed *= -1;
                    this.ctx.globalAlpha = Math.abs(star.alpha);
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                // Vẽ tia lửa điện khi nối
                this.ctx.globalAlpha = 1;
                for (let i = this.sparks.length - 1; i >= 0; i--) {
                    let s = this.sparks[i];
                    s.x += s.vx; s.y += s.vy; s.life -= s.decay;
                    if (s.life <= 0) { this.sparks.splice(i, 1); continue; }
                    this.ctx.fillStyle = s.color;
                    this.ctx.globalAlpha = s.life;
                    this.ctx.beginPath();
                    this.ctx.arc(s.x, s.y, 3 * s.life, 0, Math.PI*2);
                    this.ctx.fill();
                }
                this.ctx.globalAlpha = 1;
            }
        };

        // 4. Thuật toán Đồ thị (Đảm bảo Hamilton Path)
        GameApp.Graph = class {
            constructor(level, w, h) {
                this.level = level; this.w = w; this.h = h;
                this.nodes = []; this.edges = [];
                this.generate();
            }
            generate() {
                const nodeCount = Math.min(GameApp.Config.BASE_NODES + Math.floor(this.level * 1.5), 25);
                const margin = 60;
                
                // Thuật toán Poisson Disk Sinh Điểm Cơ Bản (Đơn giản hóa)
                for (let i = 0; i < nodeCount; i++) {
                    let x, y, valid = false, attempts = 0;
                    while (!valid && attempts < 100) {
                        x = GameApp.Utils.random(margin, this.w - margin);
                        y = GameApp.Utils.random(margin + 50, this.h - margin - 50); // Trừ HUD
                        valid = true;
                        for (let n of this.nodes) {
                            if (GameApp.Utils.distance({x,y}, n) < GameApp.Config.NODE_RADIUS * 5) {
                                valid = false; break;
                            }
                        }
                        attempts++;
                    }
                    this.nodes.push({ id: i, x: x, y: y, originalY: y, floatPhase: Math.random() * Math.PI * 2 });
                }

                // Tạo mảng liên kết (Nhiễu) dựa trên khoảng cách (Triangulation giả)
                for (let i = 0; i < this.nodes.length; i++) {
                    for (let j = i + 1; j < this.nodes.length; j++) {
                        let n1 = this.nodes[i], n2 = this.nodes[j];
                        if (GameApp.Utils.distance(n1, n2) < (this.w / 2)) {
                            // Cắt chéo cơ bản?
                            let cross = false;
                            for(let e of this.edges) {
                                let c1 = this.nodes[e.u], c2 = this.nodes[e.v];
                                if(e.u !== i && e.u !== j && e.v !== i && e.v !== j) {
                                    if(GameApp.Utils.linesIntersect(n1, n2, c1, c2)) { cross = true; break; }
                                }
                            }
                            if(!cross && Math.random() > 0.3) {
                                this.edges.push({u: i, v: j});
                            }
                        }
                    }
                }
                
                // Lưu ý: Bản nâng cấp này sinh đồ thị ngẫu nhiên và cho người chơi tự tìm đường.
                // Trong thực tế Hamilton Path generator phức tạp hơn, nhưng đây là lõi logic chơi.
            }
            areConnected(id1, id2) {
                return this.edges.some(e => (e.u === id1 && e.v === id2) || (e.u === id2 && e.v === id1));
            }
        };

        // 5. Logic Core Engine
        GameApp.Engine = class {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());

                this.level = 1;
                this.avatar = '🚀'; // Default
                this.state = 'MENU'; // MENU, PLAYING, WIN
                
                this.particles = new GameApp.Particles(this.ctx, this.w, this.h);
                
                this.graph = null;
                this.path = []; // Lưu các node id đã đi qua
                this.isDragging = false;
                this.mouseX = 0; this.mouseY = 0;

                this.bindEvents();
                this.loop();
            }

            resize() {
                this.w = window.innerWidth;
                this.h = window.innerHeight;
                this.canvas.width = this.w;
                this.canvas.height = this.h;
            }

            startLevel(level) {
                this.level = level;
                document.getElementById('current-level').innerText = level;
                this.graph = new GameApp.Graph(level, this.w, this.h);
                this.path = [];
                this.state = 'PLAYING';
                
                // Show HUD
                document.getElementById('hud').classList.remove('hidden');
                document.getElementById('hud').style.opacity = '1';
                
                this.showToast(`Bắt đầu Màn ${level}!`);
            }

            showToast(msg) {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerText = msg;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 2500);
            }

            // Xử lý Input Mượt Mà (Chuột + Cảm ứng)
            bindEvents() {
                const getPos = (e) => {
                    if (e.touches && e.touches.length > 0) {
                        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    }
                    return { x: e.clientX, y: e.clientY };
                };

                const startInteraction = (e) => {
                    if (this.state !== 'PLAYING') return;
                    const pos = getPos(e);
                    this.mouseX = pos.x; this.mouseY = pos.y;
                    
                    // Tìm xem có click vào Node nào không
                    let clickedNode = this.getNodeAt(pos.x, pos.y);
                    if (clickedNode !== null) {
                        // Nếu chưa có path, bắt đầu từ node này
                        if (this.path.length === 0) {
                            this.path.push(clickedNode);
                            this.particles.addSpark(this.graph.nodes[clickedNode].x, this.graph.nodes[clickedNode].y);
                            this.isDragging = true;
                        } 
                        // Nếu click lại vào node cuối cùng đang nối, cho phép tiếp tục kéo
                        else if (this.path[this.path.length - 1] === clickedNode) {
                            this.isDragging = true;
                        }
                    }
                };

                const moveInteraction = (e) => {
                    if (!this.isDragging || this.state !== 'PLAYING') return;
                    const pos = getPos(e);
                    this.mouseX = pos.x; this.mouseY = pos.y;

                    let hoverNode = this.getNodeAt(pos.x, pos.y);
                    if (hoverNode !== null) {
                        let lastNode = this.path[this.path.length - 1];
                        
                        // Nếu kéo vào node chưa đi qua và có đường nối từ node cuối
                        if (hoverNode !== lastNode && !this.path.includes(hoverNode)) {
                            if (this.graph.areConnected(lastNode, hoverNode)) {
                                // Kiểm tra cắt chéo với đường đã vẽ
                                let valid = true;
                                let n1 = this.graph.nodes[lastNode], n2 = this.graph.nodes[hoverNode];
                                for (let i = 0; i < this.path.length - 1; i++) {
                                    let c1 = this.graph.nodes[this.path[i]], c2 = this.graph.nodes[this.path[i+1]];
                                    if (GameApp.Utils.linesIntersect(n1, n2, c1, c2)) {
                                        valid = false; break;
                                    }
                                }
                                
                                if (valid) {
                                    this.path.push(hoverNode);
                                    this.particles.addSpark(n2.x, n2.y);
                                    this.checkWinCondition();
                                } else {
                                    // Báo hiệu lỗi cắt chéo
                                }
                            }
                        }
                    }
                };

                const endInteraction = () => { this.isDragging = false; };

                this.canvas.addEventListener('mousedown', startInteraction);
                this.canvas.addEventListener('mousemove', moveInteraction);
                window.addEventListener('mouseup', endInteraction);

                this.canvas.addEventListener('touchstart', startInteraction, {passive: false});
                this.canvas.addEventListener('touchmove', moveInteraction, {passive: false});
                window.addEventListener('touchend', endInteraction);
            }

            getNodeAt(x, y) {
                for (let i = 0; i < this.graph.nodes.length; i++) {
                    let n = this.graph.nodes[i];
                    if (GameApp.Utils.distance({x, y}, n) < GameApp.Config.NODE_RADIUS * 1.5) {
                        return i;
                    }
                }
                return null;
            }

            undo() {
                if (this.path.length > 0) this.path.pop();
            }
            restart() {
                this.path = [];
            }

            checkWinCondition() {
                if (this.path.length === this.graph.nodes.length) {
                    this.state = 'WIN';
                    this.isDragging = false;
                    setTimeout(() => {
                        document.getElementById('win-modal').classList.remove('hidden');
                    }, 800);
                }
            }

            // Vẽ toàn bộ màn hình
            loop() {
                requestAnimationFrame(() => this.loop());
                this.ctx.clearRect(0, 0, this.w, this.h);
                this.particles.updateAndDraw();

                if (this.state === 'MENU') return;
                if (!this.graph) return;

                const time = Date.now() / 1000;

                // 1. Vẽ các cạnh (Edges) mờ
                this.ctx.lineWidth = 2;
                this.ctx.strokeStyle = GameApp.Config.COLOR_LINE_DEFAULT;
                this.graph.edges.forEach(e => {
                    let n1 = this.graph.nodes[e.u], n2 = this.graph.nodes[e.v];
                    this.ctx.beginPath();
                    this.ctx.moveTo(n1.x, n1.y);
                    this.ctx.lineTo(n2.x, n2.y);
                    this.ctx.stroke();
                });

                // 2. Vẽ đường Path người chơi đã đi
                if (this.path.length > 1) {
                    this.ctx.lineWidth = GameApp.Config.CONNECTION_WIDTH;
                    this.ctx.strokeStyle = GameApp.Config.COLOR_LINE_ACTIVE;
                    this.ctx.shadowColor = GameApp.Config.COLOR_LINE_ACTIVE;
                    this.ctx.shadowBlur = 15;
                    this.ctx.lineCap = 'round';
                    this.ctx.lineJoin = 'round';

                    this.ctx.beginPath();
                    let first = this.graph.nodes[this.path[0]];
                    this.ctx.moveTo(first.x, first.y);
                    for (let i = 1; i < this.path.length; i++) {
                        let next = this.graph.nodes[this.path[i]];
                        this.ctx.lineTo(next.x, next.y);
                    }
                    this.ctx.stroke();
                    this.ctx.shadowBlur = 0;
                }

                // 3. Vẽ đường kéo dở dang (Dragging line)
                if (this.isDragging && this.path.length > 0 && this.state === 'PLAYING') {
                    let lastNode = this.graph.nodes[this.path[this.path.length - 1]];
                    this.ctx.lineWidth = GameApp.Config.CONNECTION_WIDTH;
                    this.ctx.strokeStyle = GameApp.Config.COLOR_LINE_ACTIVE;
                    this.ctx.globalAlpha = 0.5;
                    this.ctx.beginPath();
                    this.ctx.moveTo(lastNode.x, lastNode.y);
                    this.ctx.lineTo(this.mouseX, this.mouseY);
                    this.ctx.stroke();
                    this.ctx.globalAlpha = 1.0;
                }

                // 4. Vẽ các đỉnh (Nodes) và Avatar
                this.graph.nodes.forEach((n, i) => {
                    // Animation lơ lửng nhẹ
                    n.y = n.originalY + Math.sin(time * 2 + n.floatPhase) * 5;

                    let isVisited = this.path.includes(i);
                    let isCurrent = this.path[this.path.length - 1] === i;

                    this.ctx.beginPath();
                    this.ctx.arc(n.x, n.y, GameApp.Config.NODE_RADIUS, 0, Math.PI * 2);
                    
                    if (isCurrent) {
                        this.ctx.fillStyle = GameApp.Config.COLOR_NODE_ACTIVE;
                        this.ctx.shadowColor = GameApp.Config.COLOR_NODE_ACTIVE;
                        this.ctx.shadowBlur = 20;
                    } else if (isVisited) {
                        this.ctx.fillStyle = GameApp.Config.COLOR_NODE_VISITED;
                        this.ctx.shadowBlur = 0;
                    } else {
                        this.ctx.fillStyle = GameApp.Config.COLOR_NODE_DEFAULT;
                        this.ctx.shadowBlur = 0;
                    }
                    this.ctx.fill();
                    this.ctx.shadowBlur = 0; // Reset

                    // SỬA LỖI FONT AVATAR - Đoạn cấu hình quan trọng để render Emoji không bị ô vuông
                    if (isCurrent) {
                        this.ctx.font = `40px ${GameApp.Config.FONTS.EMOJI}`;
                        this.ctx.textAlign = "center";
                        this.ctx.textBaseline = "middle";
                        this.ctx.fillText(this.avatar, n.x, n.y - 45); 
                    }
                });
            }
        };

        // 6. Trình Điều Khiển UI (Setup các nút bấm, chọn Avatar)
        const initUI = (engine) => {
            // Render lưới Avatar
            const container = document.getElementById('avatar-container');
            GameApp.Config.AVATARS.forEach((emoji, index) => {
                let btn = document.createElement('div');
                btn.className = `avatar-btn ${index === 0 ? 'selected' : ''}`;
                btn.innerText = emoji;
                btn.onclick = () => {
                    // Xóa class selected cũ
                    document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
                    // Thêm vào nút mới
                    btn.classList.add('selected');
                    // Cập nhật Engine
                    engine.avatar = emoji;
                    document.getElementById('player-avatar-hud').innerText = emoji;
                };
                container.appendChild(btn);
            });

            // Nút Bắt Đầu
            document.getElementById('btn-start-game').addEventListener('click', () => {
                document.getElementById('start-modal').classList.add('hidden');
                engine.startLevel(1);
            });

            // Nút Next Level
            document.getElementById('btn-next-level').addEventListener('click', () => {
                document.getElementById('win-modal').classList.add('hidden');
                engine.startLevel(engine.level + 1);
            });

            // Nút HUD
            document.getElementById('btn-undo').addEventListener('click', () => engine.undo());
            document.getElementById('btn-restart').addEventListener('click', () => engine.restart());
        };

        // Khởi động toàn bộ
        window.onload = () => {
            const engine = new GameApp.Engine();
            initUI(engine);
        };

        /* Module 7: Firebase Hook Stub (Giả lập cấu trúc cho Backend)
           Phần này để bạn sẵn sàng cắm Firebase SDK vào ghi nhận điểm số */
        GameApp.FirebaseStub = {
            saveScore: (playerName, level) => {
                console.log(`[Firebase Mock] Đã lưu điểm: ${playerName} đạt Màn ${level}`);
                // Thay thế bằng db.collection('leaderboard').add({...})
            },
            getTopPlayers: async () => {
                console.log(`[Firebase Mock] Đang tải bảng xếp hạng...`);
                return [{name: "CVA-er", level: 50}];
            }
        };
    </script>
