<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duckie & Friends: Hamilton Adventure</title>
    <style>
        :root {
            --bg: #fff9e6;
            --primary: #f39c12;
            --accent: #ffcc33;
            --text: #795548;
            --panel: rgba(255, 255, 255, 0.85);
        }

        body {
            margin: 0; padding: 0; overflow: hidden;
            background: var(--bg);
            font-family: 'Segoe UI', cursive, sans-serif;
            color: var(--text);
            touch-action: none;
        }

        /* Hiệu ứng nền tinh vân nhẹ */
        #bg-canvas { position: fixed; inset: 0; z-index: -1; }

        .screen {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255, 249, 230, 0.95); padding: 20px;
        }

        .glass-box {
            background: var(--panel); backdrop-filter: blur(8px);
            padding: 25px; border-radius: 40px; border: 6px solid var(--accent);
            box-shadow: 12px 12px 0px #e67e22; max-width: 400px; width: 90%;
        }

        /* Avatar Grid */
        .avatar-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0;
        }
        .avatar-opt {
            font-size: 30px; width: 55px; height: 55px; background: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 3px solid transparent; transition: 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        .avatar-opt.selected { border-color: var(--primary); background: #fffde7; transform: scale(1.1); }

        input {
            width: 80%; padding: 12px; border-radius: 20px; border: 3px solid var(--primary);
            font-size: 1rem; outline: none; text-align: center; margin-bottom: 20px;
        }

        button {
            background: #ff6f00; color: white; border: none; padding: 12px 30px;
            border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 #bf360c;
        }
        button:active { transform: translateY(3px); box-shadow: none; }

        /* Tutorial & Mascot */
        #mascot {
            position: absolute; bottom: 20px; right: 20px; font-size: 60px;
            animation: bounce 1s infinite alternate cubic-bezier(0.6, -0.28, 0.735, 0.045);
            display: none; z-index: 100;
        }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-30px); } }

        .speech-bubble {
            position: absolute; bottom: 100px; right: 40px; background: white;
            padding: 15px; border-radius: 20px; border: 3px solid var(--primary);
            max-width: 150px; font-size: 0.9rem; display: none; z-index: 100;
        }

        #game-ui {
            position: absolute; top: 20px; width: 100%; display: flex;
            justify-content: space-around; pointer-events: none; z-index: 10;
        }
        
        .lb-card {
            position: absolute; left: 20px; top: 100px; width: 180px;
            background: var(--panel); border-radius: 20px; padding: 10px; border: 2px solid var(--accent);
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <!-- Màn hình hướng dẫn của Vịt Vàng -->
    <div id="tutorial-screen" class="screen">
        <div class="glass-box" style="text-align: center;">
            <div style="font-size: 80px;">🐥</div>
            <h2 style="color: #d35400;">Chào bạn nha!</h2>
            <p>Mình là <b>Vịt Vàng</b>. Nhiệm vụ của bạn là nối tất cả các điểm sao cho đường đi <b>không lặp lại</b> và <b>đi hết các trạm</b> nhé!</p>
            <button onclick="showStartScreen()">HIỂU RỒI!</button>
        </div>
    </div>

    <!-- Màn hình đăng nhập -->
    <div id="start-screen" class="screen" style="display: none;">
        <div class="glass-box" style="text-align: center;">
            <h3 style="margin-top:0">Chọn bạn đồng hành</h3>
            <div class="avatar-grid" id="avatar-list">
                <!-- Sẽ render bằng JS -->
            </div>
            <input type="text" id="user-name" placeholder="Tên của bạn..." maxlength="10">
            <br>
            <button onclick="game.start()">VÀO GAME THÔI!</button>
        </div>
    </div>

    <div id="game-ui">
        <div class="glass-box" style="padding: 10px 20px; box-shadow: 4px 4px 0 #e67e22;">LV: <span id="lvl">1</span></div>
        <div class="glass-box" style="padding: 10px 20px; box-shadow: 4px 4px 0 #e67e22;">⏱️ <span id="timer">0</span>s</div>
    </div>

    <div class="lb-card" id="leaderboard"></div>

    <div id="mascot">🐰</div>
    <div class="speech-bubble" id="bubble">Cố lên bạn ơi! ✨</div>

    <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 100; width: 100%; text-align: center;">
        <button onclick="game.undo()" style="background:#e67e22">Hoàn tác</button>
        <button onclick="game.restart()" style="background:#f39c12">Chơi lại</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="win-screen" class="screen" style="display: none; background: rgba(255, 249, 230, 0.9);">
        <div class="glass-box" style="text-align: center;">
            <h1 style="color: #ff6f00; font-size: 3rem;">GIỎI QUÁ! 🎊</h1>
            <p id="win-info"></p>
            <button onclick="game.nextLevel()">MÀN TIẾP THEO</button>
        </div>
    </div>

<script>
    const avatars = ['🐶','🐱','🐻','🦊','🐥','🐸','🐼','🐨','🐷','🐯','🦁','🐰'];
    let selectedAvatar = '🐥';

    function showStartScreen() {
        document.getElementById('tutorial-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'flex';
        const list = document.getElementById('avatar-list');
        avatars.forEach(a => {
            const div = document.createElement('div');
            div.className = 'avatar-opt' + (a === '🐥' ? ' selected' : '');
            div.innerText = a;
            div.onclick = () => {
                document.querySelectorAll('.avatar-opt').forEach(o => o.classList.remove('selected'));
                div.classList.add('selected');
                selectedAvatar = a;
            };
            list.appendChild(div);
        });
    }

    class HamiltonGame {
        constructor() {
            this.canvas = document.getElementById('game-canvas');
            this.ctx = this.canvas.getContext('2d');
            this.bgCanvas = document.getElementById('bg-canvas');
            this.bgCtx = this.bgCanvas.getContext('2d');
            this.level = 1;
            this.nodes = []; this.edges = []; this.path = []; this.stars = [];
            this.particles = []; // Hạt bụi bay lơ lửng ở nền
            this.startTime = 0;
            this.isWon = false;
            this.records = JSON.parse(localStorage.getItem('hamilton_v3')) || [];

            this.init();
        }

        init() {
            this.resize();
            window.addEventListener('resize', () => this.resize());
            this.createBgParticles();
            this.updateLeaderboard();
            
            const handleAction = (e) => {
                if(this.isWon) return;
                const rect = this.canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                this.nodes.forEach(n => {
                    if(Math.hypot(n.x - x, n.y - y) < 40) this.selectNode(n.id);
                });
            };

            this.canvas.addEventListener('mousedown', handleAction);
            this.canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleAction(e); }, {passive: false});
            this.animate();
        }

        resize() {
            this.canvas.width = this.bgCanvas.width = window.innerWidth;
            this.canvas.height = this.bgCanvas.height = window.innerHeight;
        }

        createBgParticles() {
            for(let i=0; i<30; i++) {
                this.particles.push({
                    x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight,
                    r: Math.random()*4 + 2, vx: Math.random()-0.5, vy: Math.random()-0.5,
                    color: `rgba(243, 156, 18, ${Math.random()*0.3})`
                });
            }
        }

        start() {
            const name = document.getElementById('user-name').value.trim();
            if(!name) return alert("Cho mình biết tên bạn đã!");
            this.userName = name;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('mascot').style.display = 'block';
            document.getElementById('bubble').style.display = 'block';
            this.generateLevel();
        }

        generateLevel() {
            this.nodes = []; this.edges = []; this.path = []; this.isWon = false;
            this.startTime = Date.now();
            document.getElementById('win-screen').style.display = 'none';
            document.getElementById('lvl').innerText = this.level;

            const count = 3 + this.level;
            for(let i=0; i<count; i++) {
                let x, y, ok = false;
                while(!ok) {
                    x = 80 + Math.random() * (this.canvas.width - 160);
                    y = 120 + Math.random() * (this.canvas.height - 250);
                    ok = this.nodes.every(n => Math.hypot(n.x - x, n.y - y) > 90);
                }
                this.nodes.push({id: i, x, y});
            }

            const sol = [...Array(count).keys()].sort(() => Math.random() - 0.5);
            for(let i=0; i<count-1; i++) this.edges.push([sol[i], sol[i+1]]);
            for(let i=0; i<count; i++) {
                const a = Math.floor(Math.random()*count), b = Math.floor(Math.random()*count);
                if(a !== b) this.edges.push([a, b]);
            }
        }

        selectNode(id) {
            if(this.path.includes(id)) {
                if(this.path[this.path.length-1] === id) this.path.pop();
                return;
            }
            const last = this.path[this.path.length-1];
            if(this.path.length === 0 || this.edges.some(e => (e[0]===last && e[1]===id) || (e[1]===last && e[0]===id))) {
                this.path.push(id);
                this.createStars(this.nodes[id].x, this.nodes[id].y);
                this.cheer();
                if(this.path.length === this.nodes.length) this.win();
            }
        }

        cheer() {
            const bubbles = ["Đỉnh quá!", "Tiếp đi bạn!", "Sắp xong rồi!", "Wow!", "Bạn giỏi thật!"];
            document.getElementById('bubble').innerText = bubbles[Math.floor(Math.random()*bubbles.length)];
            const m = document.getElementById('mascot');
            m.innerText = avatars[Math.floor(Math.random()*avatars.length)];
        }

        createStars(x, y) {
            for(let i=0; i<10; i++) {
                this.stars.push({
                    x, y, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12,
                    s: Math.random()*15+5, life: 1
                });
            }
        }

        win() {
            this.isWon = true;
            const time = Math.floor((Date.now() - this.startTime)/1000);
            this.records.push({name: this.userName, avatar: selectedAvatar, time});
            this.records.sort((a,b) => a.time - b.time);
            this.records = this.records.slice(0, 5);
            localStorage.setItem('hamilton_v3', JSON.stringify(this.records));
            this.updateLeaderboard();

            document.getElementById('win-info').innerText = `Bạn hoàn thành trong ${time} giây!`;
            document.getElementById('win-screen').style.display = 'flex';
        }

        updateLeaderboard() {
            const lb = document.getElementById('leaderboard');
            lb.innerHTML = '<h4 style="margin:5px">🏆 TOP CAO THỦ</h4>';
            this.records.forEach(r => {
                lb.innerHTML += `<div style="font-size:0.8rem; padding:4px">${r.avatar} ${r.name} - ${r.time}s</div>`;
            });
        }

        undo() { this.path.pop(); }
        restart() { this.path = []; this.startTime = Date.now(); }
        nextLevel() { this.level++; this.generateLevel(); }

        draw() {
            // 1. Draw Background
            this.bgCtx.clearRect(0,0,this.bgCanvas.width, this.bgCanvas.height);
            this.particles.forEach(p => {
                this.bgCtx.fillStyle = p.color;
                this.bgCtx.beginPath(); this.bgCtx.arc(p.x, p.y, p.r, 0, Math.PI*2); this.bgCtx.fill();
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0 || p.x > window.innerWidth) p.vx *= -1;
                if(p.y < 0 || p.y > window.innerHeight) p.vy *= -1;
            });

            // 2. Draw Game
            this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
            
            // Edges
            this.ctx.strokeStyle = '#e0e0e0'; this.ctx.lineWidth = 4;
            this.edges.forEach(e => {
                this.ctx.beginPath(); this.ctx.moveTo(this.nodes[e[0]].x, this.nodes[e[0]].y);
                this.ctx.lineTo(this.nodes[e[1]].x, this.nodes[e[1]].y); this.ctx.stroke();
            });

            // Current Path
            if(this.path.length > 1) {
                this.ctx.strokeStyle = '#f39c12'; this.ctx.lineWidth = 10; this.ctx.lineCap = 'round';
                this.ctx.beginPath();
                this.path.forEach((id, i) => {
                    const n = this.nodes[id];
                    if(i===0) this.ctx.moveTo(n.x, n.y); else this.ctx.lineTo(n.x, n.y);
                });
                this.ctx.stroke();
            }

            // Nodes
            this.nodes.forEach(n => {
                const active = this.path.includes(n.id);
                this.ctx.fillStyle = active ? '#f39c12' : 'white';
                this.ctx.strokeStyle = '#f39c12'; this.ctx.lineWidth = 4;
                this.ctx.beginPath(); this.ctx.arc(n.x, n.y, 18, 0, Math.PI*2); this.ctx.fill(); this.ctx.stroke();
                if(active) {
                    this.ctx.fillStyle = "white"; this.ctx.font = "14px serif";
                    this.ctx.fillText("✨", n.x-8, n.y+5);
                }
            });

            // Stars
            this.stars.forEach((s, i) => {
                this.ctx.globalAlpha = s.life;
                this.ctx.font = `${s.s}px serif`;
                this.ctx.fillText("⭐", s.x, s.y);
                s.x += s.vx; s.y += s.vy; s.life -= 0.03;
                if(s.life <= 0) this.stars.splice(i, 1);
            });
            this.ctx.globalAlpha = 1;

            if(!this.isWon && this.startTime > 0) {
                document.getElementById('timer').innerText = Math.floor((Date.now() - this.startTime)/1000);
            }
        }

        animate() { this.draw(); requestAnimationFrame(() => this.animate()); }
    }

    const game = new HamiltonGame();
</script>
</body>
</html>
