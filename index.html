<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hamilton Dreamy Galaxy</title>
    <style>
        :root {
            --p1: #ff9a9e; --p2: #fad0c4; --p3: #a1c4fd; --p4: #c2e9fb;
            --text: #ffffff;
            --glow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        body {
            margin: 0; padding: 0; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #2c3e50, #4ca1af, #2c3e50, #000000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text);
            touch-action: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Overlay UI */
        .hud {
            position: absolute; width: 100%; top: 20px;
            display: flex; justify-content: space-around;
            pointer-events: none; z-index: 10;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 8px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: bold; letter-spacing: 1px;
        }

        .controls {
            position: absolute; bottom: 40px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 20px;
            z-index: 10;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 12px 35px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(5px);
            text-transform: uppercase;
        }

        button:hover {
            background: white; color: #4ca1af;
            transform: translateY(-5px);
            box-shadow: var(--glow);
        }

        #game-canvas { display: block; filter: contrast(1.1); }

        /* Win Modal */
        #win-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }

        .modal-body {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            padding: 50px; border-radius: 40px; text-align: center;
            border: 4px solid white; box-shadow: 0 0 50px rgba(255,255,255,0.4);
            color: #333;
        }
    </style>
</head>
<body>

    <div class="hud">
        <div class="glass-card">LEVEL: <span id="lvl">1</span></div>
        <div class="glass-card">TIME: <span id="time">00:00</span></div>
    </div>

    <div class="controls">
        <button onclick="game.undo()">Hoàn tác</button>
        <button onclick="game.restart()">Chơi lại</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="win-modal">
        <div class="modal-body">
            <h1 style="margin:0; font-size: 3rem;">TUYỆT VỜI!</h1>
            <p id="result-text" style="font-size: 1.2rem; margin: 20px 0; font-weight: 500;"></p>
            <button onclick="game.nextLevel()" style="background: #333; color: white;">Tiếp theo</button>
        </div>
    </div>

<script>
class DreamyGalaxy {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.level = 1;
        this.nodes = [];
        this.edges = [];
        this.path = [];
        this.clouds = [];
        this.isWon = false;
        this.startTime = Date.now();

        this.init();
        this.animate();
    }

    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.createClouds();
        this.generateLevel();
        this.setupInput();
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    createClouds() {
        this.clouds = Array.from({length: 15}, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: 50 + Math.random() * 150,
            v: 0.2 + Math.random() * 0.5,
            opacity: 0.1 + Math.random() * 0.2
        }));
    }

    generateLevel() {
        this.nodes = [];
        this.edges = [];
        this.path = [];
        this.isWon = false;
        this.startTime = Date.now();
        document.getElementById('win-modal').style.display = 'none';

        const count = 4 + this.level;
        const pad = 100;

        for(let i=0; i<count; i++) {
            let x, y, ok = false;
            while(!ok) {
                x = pad + Math.random() * (this.canvas.width - pad*2);
                y = pad + Math.random() * (this.canvas.height - pad*2);
                ok = this.nodes.every(n => Math.hypot(n.x - x, n.y - y) > 100);
            }
            this.nodes.push({
                id: i, x, y, 
                baseX: x, baseY: y,
                phase: Math.random() * Math.PI * 2,
                color: `hsl(${200 + Math.random() * 60}, 70%, 85%)`
            });
        }

        // Tạo Hamilton Path mẫu (Solution)
        const sequence = [...Array(count).keys()].sort(() => Math.random() - 0.5);
        for(let i=0; i<count-1; i++) {
            this.edges.push([sequence[i], sequence[i+1]]);
        }

        // Thêm cạnh nhiễu (Phải rõ hơn bản trước)
        for(let i=0; i<count; i++) {
            const a = Math.floor(Math.random() * count);
            const b = Math.floor(Math.random() * count);
            if(a !== b && !this.edges.some(e => e.includes(a) && e.includes(b))) {
                this.edges.push([a, b]);
            }
        }
    }

    setupInput() {
        const handle = (e) => {
            if(this.isWon) return;
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            this.nodes.forEach(n => {
                if(Math.hypot(n.x - x, n.y - y) < 40) this.selectNode(n.id);
            });
        };
        window.addEventListener('mousedown', handle);
        window.addEventListener('touchstart', handle);
    }

    selectNode(id) {
        if(this.path.includes(id)) {
            if(this.path[this.path.length-2] === id) this.path.pop();
            return;
        }
        if(this.path.length === 0) {
            this.path.push(id);
        } else {
            const last = this.path[this.path.length-1];
            if(this.edges.some(e => (e[0]===last && e[1]===id) || (e[1]===last && e[0]===id))) {
                this.path.push(id);
                if(this.path.length === this.nodes.length) this.win();
            }
        }
    }

    win() {
        this.isWon = true;
        document.getElementById('result-text').innerText = `Bạn đã chinh phục Level ${this.level}!`;
        setTimeout(() => document.getElementById('win-modal').style.display = 'flex', 600);
    }

    nextLevel() { this.level++; document.getElementById('lvl').innerText = this.level; this.generateLevel(); }
    undo() { this.path.pop(); }
    restart() { this.path = []; this.startTime = Date.now(); }

    update() {
        // Floating effect cho nodes
        this.nodes.forEach(n => {
            n.x = n.baseX + Math.cos(Date.now() * 0.002 + n.phase) * 10;
            n.y = n.baseY + Math.sin(Date.now() * 0.002 + n.phase) * 10;
        });

        // Di chuyển mây
        this.clouds.forEach(c => {
            c.x += c.v;
            if(c.x - c.r > window.innerWidth) c.x = -c.r;
        });
    }

    draw() {
        const {ctx, canvas} = this;
        ctx.clearRect(0,0, canvas.width, canvas.height);

        // 1. Draw Clouds (Hiệu ứng tinh vân mờ ảo như trong ảnh)
        this.clouds.forEach(c => {
            const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
            grad.addColorStop(0, `rgba(255, 255, 255, ${c.opacity})`);
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.fill();
        });

        // 2. Draw Potential Edges (Đường kẻ nổi bật rực rỡ)
        ctx.lineWidth = 2.5;
        this.edges.forEach(e => {
            const n1 = this.nodes[e[0]], n2 = this.nodes[e[1]];
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.shadowBlur = 10; ctx.shadowColor = 'white';
            ctx.beginPath(); ctx.moveTo(n1.x, n1.y); ctx.lineTo(n2.x, n2.y); ctx.stroke();
        });
        ctx.shadowBlur = 0;

        // 3. Draw Active Path (Rainbow / Dreamy Line)
        if(this.path.length > 1) {
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#fff';
            ctx.strokeStyle = 'white';
            ctx.beginPath();
            this.path.forEach((id, i) => {
                const n = this.nodes[id];
                if(i===0) ctx.moveTo(n.x, n.y);
                else ctx.lineTo(n.x, n.y);
            });
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // 4. Draw Nodes (Ngôi sao phát sáng)
        this.nodes.forEach(n => {
            const active = this.path.includes(n.id);
            const last = this.path[this.path.length-1] === n.id;
            
            ctx.save();
            ctx.shadowBlur = active ? 25 : 5;
            ctx.shadowColor = 'white';
            ctx.fillStyle = active ? '#fff' : 'rgba(255,255,255,0.4)';
            
            ctx.beginPath();
            ctx.arc(n.x, n.y, last ? 14 : 10, 0, Math.PI*2);
            ctx.fill();
            
            if(last) {
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(n.x, n.y, 22 + Math.sin(Date.now()*0.01)*5, 0, Math.PI*2);
                ctx.stroke();
            }
            ctx.restore();
        });

        // Timer
        if(!this.isWon) {
            const s = Math.floor((Date.now()-this.startTime)/1000);
            document.getElementById('time').innerText = 
                `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
        }
    }

    animate() {
        this.update();
        this.draw();
        requestAnimationFrame(() => this.animate());
    }
}

const game = new DreamyGalaxy();
</script>
</body>
</html>
