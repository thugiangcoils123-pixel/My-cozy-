<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Dream - Hamilton Game</title>
    <style>
        :root {
            --bg: #fdf5e6;
            --primary: #e67e22;
            --accent: #f1c40f;
            --text: #5d4037;
            --panel: rgba(255, 255, 255, 0.7);
        }

        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: var(--bg);
            background-image: radial-gradient(#f39c12 0.5px, transparent 0.5px);
            background-size: 20px 20px; /* Hiệu ứng chấm dot retro */
            font-family: 'Comic Sans MS', 'Cursive', sans-serif;
            color: var(--text);
            touch-action: none;
        }

        /* Overlay Screens */
        .screen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: var(--bg); padding: 20px; text-align: center;
        }

        .glass-box {
            background: var(--panel); backdrop-filter: blur(5px);
            padding: 30px; border-radius: 30px; border: 5px solid var(--accent);
            box-shadow: 10px 10px 0px var(--primary);
        }

        /* Inputs & Buttons */
        input {
            padding: 15px; border-radius: 15px; border: 3px solid var(--primary);
            font-size: 1.1rem; width: 200px; margin-bottom: 20px; outline: none;
        }

        .avatar-select { display: flex; gap: 15px; margin-bottom: 20px; }
        .avatar-opt {
            width: 60px; height: 60px; border-radius: 50%; cursor: pointer;
            border: 4px solid transparent; transition: 0.3s; background: white;
            display: flex; justify-content: center; align-items: center; font-size: 30px;
        }
        .avatar-opt.selected { border-color: var(--primary); transform: scale(1.1); }

        button {
            background: var(--primary); color: white; border: none;
            padding: 12px 25px; border-radius: 50px; cursor: pointer;
            font-weight: bold; font-family: inherit; transition: 0.2s;
            box-shadow: 0 4px 0 #a0522d; margin: 5px;
        }
        button:active { transform: translateY(4px); box-shadow: none; }

        /* In-game UI */
        #game-ui {
            position: absolute; top: 20px; width: 100%;
            display: flex; justify-content: space-around; pointer-events: none;
        }

        #leaderboard {
            position: absolute; right: 20px; top: 100px;
            width: 200px; max-height: 300px; overflow-y: auto;
        }

        .lb-item {
            background: var(--panel); margin-bottom: 5px; padding: 8px;
            border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- Màn hình khởi đầu -->
    <div id="start-screen" class="screen">
        <div class="glass-box">
            <h1 style="color: var(--primary)">✨ GOLDEN DREAM</h1>
            <input type="text" id="user-name" placeholder="Nhập tên bạn..." maxlength="10">
            <div class="avatar-select" id="avatar-list">
                <div class="avatar-opt" data-img="🐶">🐶</div>
                <div class="avatar-opt" data-img="🐱">🐱</div>
                <div class="avatar-opt" data-img="🐻">🐻</div>
                <div class="avatar-opt" data-img="🦊">🦊</div>
            </div>
            <button onclick="game.startFirstTime()">BẮT ĐẦU</button>
        </div>
    </div>

    <!-- UI chính -->
    <div id="game-ui">
        <div class="glass-box" style="padding: 10px 20px;">LV: <span id="lvl">1</span></div>
        <div class="glass-box" style="padding: 10px 20px;">⏱️ <span id="timer">00</span>s</div>
    </div>

    <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10;">
        <button onclick="game.undo()">Hoàn tác</button>
        <button onclick="game.restart()">Chơi lại</button>
        <button onclick="game.showSolution()" style="background: #95a5a6;">Xem đáp án</button>
    </div>

    <div id="leaderboard"></div>

    <canvas id="canvas"></canvas>

    <!-- Màn hình thắng -->
    <div id="win-screen" class="screen" style="display: none; background: rgba(253,245,230,0.8);">
        <div class="glass-box">
            <h1 id="win-msg">THÀNH CÔNG!</h1>
            <p id="win-time"></p>
            <button onclick="game.nextLevel()">MÀN TIẾP THEO</button>
        </div>
    </div>

<script>
class GoldenGame {
    constructor() {
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.userName = "";
        this.userAvatar = "🐶";
        this.level = 1;
        this.nodes = [];
        this.edges = [];
        this.path = [];
        this.stars = [];
        this.solution = [];
        this.isSolutionUsed = false;
        this.isWon = false;
        this.startTime = 0;
        this.records = JSON.parse(localStorage.getItem('hamilton_lb')) || [];

        this.init();
        this.animate();
    }

    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.setupAvatars();
        this.updateLeaderboard();
        
        const check = (e) => {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            this.nodes.forEach(n => {
                if(Math.hypot(n.x - x, n.y - y) < 40) this.handleSelect(n.id);
            });
        };
        window.addEventListener('mousedown', check);
        window.addEventListener('touchstart', check);
    }

    setupAvatars() {
        const opts = document.querySelectorAll('.avatar-opt');
        opts.forEach(opt => {
            opt.onclick = () => {
                opts.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                this.userAvatar = opt.dataset.img;
            };
        });
        opts[0].click();
    }

    startFirstTime() {
        const name = document.getElementById('user-name').value.trim();
        if(!name) return alert("Vui lòng nhập tên!");
        this.userName = name;
        document.getElementById('start-screen').style.display = 'none';
        this.generateLevel();
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    generateLevel() {
        this.nodes = []; this.edges = []; this.path = [];
        this.isWon = false; this.isSolutionUsed = false;
        this.startTime = Date.now();
        document.getElementById('win-screen').style.display = 'none';
        document.getElementById('lvl').innerText = this.level;

        const count = 3 + this.level;
        for(let i=0; i<count; i++) {
            let x, y, ok = false;
            while(!ok) {
                x = 100 + Math.random() * (window.innerWidth - 200);
                y = 150 + Math.random() * (window.innerHeight - 300);
                ok = this.nodes.every(n => Math.hypot(n.x - x, n.y - y) > 100);
            }
            this.nodes.push({id: i, x, y});
        }

        this.solution = [...Array(count).keys()].sort(() => Math.random() - 0.5);
        for(let i=0; i<count-1; i++) this.edges.push([this.solution[i], this.solution[i+1]]);
        
        for(let i=0; i<count; i++) {
            const a = Math.floor(Math.random()*count), b = Math.floor(Math.random()*count);
            if(a !== b) this.edges.push([a, b]);
        }
    }

    handleSelect(id) {
        if(this.path.includes(id)) {
            if(this.path[this.path.length-2] === id) this.path.pop();
            return;
        }

        const last = this.path[this.path.length-1];
        if(this.path.length === 0 || this.edges.some(e => (e[0]===last && e[1]===id) || (e[1]===last && e[0]===id))) {
            this.path.push(id);
            this.createBurst(this.nodes[id].x, this.nodes[id].y);
            if(this.path.length === this.nodes.length) this.win();
        }
    }

    createBurst(x, y) {
        for(let i=0; i<15; i++) {
            this.stars.push({
                x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                size: Math.random()*15 + 5, life: 1
            });
        }
    }

    win() {
        this.isWon = true;
        const time = Math.floor((Date.now() - this.startTime)/1000);
        this.playSound();
        
        if(!this.isSolutionUsed) {
            this.records.push({name: this.userName, avatar: this.userAvatar, time});
            this.records.sort((a,b) => a.time - b.time);
            this.records = this.records.slice(0, 5);
            localStorage.setItem('hamilton_lb', JSON.stringify(this.records));
            this.updateLeaderboard();
        }

        document.getElementById('win-msg').innerText = this.isSolutionUsed ? "ĐÃ XEM ĐÁP ÁN" : "THÀNH CÔNG!";
        document.getElementById('win-time').innerText = `Thời gian: ${time} giây`;
        document.getElementById('win-screen').style.display = 'flex';
    }

    updateLeaderboard() {
        const lb = document.getElementById('leaderboard');
        lb.innerHTML = '<h4 style="margin:0 0 10px 0">🏆 BẢNG XẾP HẠNG</h4>';
        this.records.forEach(r => {
            lb.innerHTML += `<div class="lb-item"><span>${r.avatar}</span> <b>${r.name}</b> <span>${r.time}s</span></div>`;
        });
    }

    playSound() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'triangle'; osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    }

    showSolution() {
        this.isSolutionUsed = true;
        this.path = [];
        let i = 0;
        const itv = setInterval(() => {
            if(i < this.solution.length) {
                this.handleSelect(this.solution[i]);
                i++;
            } else clearInterval(itv);
        }, 300);
    }

    undo() { this.path.pop(); }
    restart() { this.path = []; this.startTime = Date.now(); this.isSolutionUsed = false; }
    nextLevel() { this.level++; this.generateLevel(); }

    draw() {
        const {ctx, canvas} = this;
        ctx.clearRect(0,0, canvas.width, canvas.height);

        // Edges
        ctx.strokeStyle = '#d7ccc8'; ctx.lineWidth = 3;
        this.edges.forEach(e => {
            ctx.beginPath(); ctx.moveTo(this.nodes[e[0]].x, this.nodes[e[0]].y);
            ctx.lineTo(this.nodes[e[1]].x, this.nodes[e[1]].y); ctx.stroke();
        });

        // Path
        if(this.path.length > 1) {
            ctx.strokeStyle = var(--primary); ctx.lineWidth = 8; ctx.lineCap = 'round';
            ctx.beginPath();
            this.path.forEach((id, i) => {
                const n = this.nodes[id];
                if(i===0) ctx.moveTo(n.x, n.y); else ctx.lineTo(n.x, n.y);
            });
            ctx.stroke();
        }

        // Nodes
        this.nodes.forEach(n => {
            const active = this.path.includes(n.id);
            ctx.fillStyle = active ? '#e67e22' : '#fff';
            ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(n.x, n.y, 15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            if(active) {
                ctx.fillStyle = "white"; ctx.font = "12px serif";
                ctx.fillText("⭐", n.x-7, n.y+5);
            }
        });

        // Stars Burst
        this.stars.forEach((s, i) => {
            ctx.fillStyle = `rgba(241, 196, 15, ${s.life})`;
            ctx.font = `${s.size}px serif`;
            ctx.fillText("⭐", s.x, s.y);
            s.x += s.vx; s.y += s.vy; s.life -= 0.02;
            if(s.life <= 0) this.stars.splice(i, 1);
        });

        if(!this.isWon) {
            document.getElementById('timer').innerText = Math.floor((Date.now() - this.startTime)/1000);
        }
    }

    animate() { this.draw(); requestAnimationFrame(() => this.animate()); }
}

const game = new GoldenGame();
</script>
</body>
</html>
