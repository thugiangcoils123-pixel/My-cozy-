<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Dream - Fixed Avatar</title>
    <style>
        :root {
            --bg: #fdf5e6;
            --primary: #e67e22;
            --accent: #f1c40f;
            --text: #5d4037;
            --panel: rgba(255, 255, 255, 0.8);
        }

        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: var(--bg);
            background-image: radial-gradient(#f39c12 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            touch-action: none;
        }

        .screen {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: var(--bg); padding: 20px;
        }

        .glass-box {
            background: var(--panel); backdrop-filter: blur(5px);
            padding: 30px; border-radius: 30px; border: 5px solid var(--accent);
            box-shadow: 8px 8px 0px var(--primary);
            max-width: 90%;
        }

        input {
            padding: 15px; border-radius: 15px; border: 3px solid var(--primary);
            font-size: 1.1rem; width: 80%; margin-bottom: 20px; outline: none;
            text-align: center;
        }

        .avatar-select { 
            display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; 
            flex-wrap: wrap;
        }

        .avatar-opt {
            width: 65px; height: 65px; border-radius: 50%; cursor: pointer;
            border: 4px solid #fff; transition: all 0.2s ease;
            background: white; display: flex; justify-content: center; 
            align-items: center; font-size: 35px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            pointer-events: auto; /* Đảm bảo nhận sự kiện */
        }

        .avatar-opt:hover { transform: translateY(-3px); }
        .avatar-opt.selected { 
            border-color: var(--primary); 
            background: var(--accent);
            transform: scale(1.15); 
        }

        button {
            background: var(--primary); color: white; border: none;
            padding: 12px 35px; border-radius: 50px; cursor: pointer;
            font-weight: bold; font-size: 1rem; transition: 0.2s;
            box-shadow: 0 4px 0 #a0522d; margin: 5px;
        }
        button:active { transform: translateY(3px); box-shadow: none; }

        #game-ui {
            position: absolute; top: 20px; width: 100%;
            display: flex; justify-content: space-around; pointer-events: none;
            z-index: 10;
        }

        #leaderboard {
            position: absolute; right: 20px; top: 110px;
            width: 220px; padding: 10px; border-radius: 20px;
            background: var(--panel); border: 2px solid var(--accent);
            z-index: 5;
        }

        .lb-item {
            background: white; margin-bottom: 6px; padding: 10px;
            border-radius: 12px; display: flex; align-items: center; gap: 12px; 
            font-size: 0.85rem; border: 1px solid #eee;
        }

        canvas { display: block; }
    </style>
</head>
<body>

    <div id="start-screen" class="screen">
        <div class="glass-box">
            <h1 style="color: var(--primary); margin-top:0">✨ GOLDEN DREAM</h1>
            <p>Chọn nhân vật và nhập tên bạn</p>
            
            <div class="avatar-select">
                <div class="avatar-opt" onclick="setAvatar(this, '🐶')">🐶</div>
                <div class="avatar-opt" onclick="setAvatar(this, '🐱')">🐱</div>
                <div class="avatar-opt" onclick="setAvatar(this, '🐻')">🐻</div>
                <div class="avatar-opt" onclick="setAvatar(this, '🦊')">🦊</div>
            </div>

            <input type="text" id="user-name" placeholder="Tên của bạn..." maxlength="12">
            <br>
            <button onclick="game.startFirstTime()">BẮT ĐẦU CHƠI</button>
        </div>
    </div>

    <div id="game-ui">
        <div class="glass-box" style="padding: 10px 25px;">LEVEL: <span id="lvl">1</span></div>
        <div class="glass-box" style="padding: 10px 25px;">⏱️ <span id="timer">00</span>s</div>
    </div>

    <div id="leaderboard"></div>

    <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 20; width: 100%; text-align: center;">
        <button onclick="game.undo()">Hoàn tác</button>
        <button onclick="game.restart()">Chơi lại</button>
        <button onclick="game.showSolution()" style="background: #95a5a6;">Đáp án</button>
    </div>

    <canvas id="canvas"></canvas>

    <div id="win-screen" class="screen" style="display: none; background: rgba(253,245,230,0.9);">
        <div class="glass-box" style="text-align: center;">
            <h1 id="win-msg" style="font-size: 2.5rem; color: var(--primary);">XUẤT SẮC!</h1>
            <p id="win-time" style="font-size: 1.2rem;"></p>
            <button onclick="game.nextLevel()">TIẾP TỤC</button>
        </div>
    </div>

<script>
    // Hàm chọn Avatar được tách riêng để đảm bảo độ nhạy
    let selectedAvatar = "🐶";
    function setAvatar(el, icon) {
        document.querySelectorAll('.avatar-opt').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected');
        selectedAvatar = icon;
        // Hiệu ứng âm thanh nhẹ khi chọn (tùy chọn)
        if(window.game) game.playTickSound();
    }

    class GoldenGame {
        constructor() {
            this.canvas = document.getElementById('canvas');
            this.ctx = this.canvas.getContext('2d');
            this.level = 1;
            this.nodes = [];
            this.edges = [];
            this.path = [];
            this.stars = [];
            this.solution = [];
            this.isSolutionUsed = false;
            this.isWon = false;
            this.startTime = 0;
            this.records = JSON.parse(localStorage.getItem('hamilton_records_v2')) || [];

            this.init();
            this.animate();
        }

        init() {
            this.resize();
            window.addEventListener('resize', () => this.resize());
            this.updateLeaderboard();
            
            // Chỉ bắt sự kiện click cho Canvas để tránh xung đột với UI
            const handleTouch = (e) => {
                if(this.isWon) return;
                const rect = this.canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                
                this.nodes.forEach(n => {
                    if(Math.hypot(n.x - x, n.y - y) < 35) this.handleSelect(n.id);
                });
            };

            this.canvas.addEventListener('mousedown', handleTouch);
            this.canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleTouch(e);
            }, {passive: false});

            // Mặc định chọn avatar đầu tiên
            document.querySelector('.avatar-opt').classList.add('selected');
        }

        resize() {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }

        startFirstTime() {
            const name = document.getElementById('user-name').value.trim();
            if(!name) {
                alert("Bạn chưa nhập tên kìa!");
                return;
            }
            this.userName = name;
            this.userAvatar = selectedAvatar;
            document.getElementById('start-screen').style.display = 'none';
            this.generateLevel();
        }

        generateLevel() {
            this.nodes = []; this.edges = []; this.path = [];
            this.isWon = false; this.isSolutionUsed = false;
            this.startTime = Date.now();
            document.getElementById('win-screen').style.display = 'none';
            document.getElementById('lvl').innerText = this.level;

            const count = 3 + this.level;
            const margin = 100;

            for(let i=0; i<count; i++) {
                let x, y, ok = false;
                while(!ok) {
                    x = margin + Math.random() * (this.canvas.width - margin*2);
                    y = margin + 50 + Math.random() * (this.canvas.height - margin*2 - 100);
                    ok = this.nodes.every(n => Math.hypot(n.x - x, n.y - y) > 90);
                }
                this.nodes.push({id: i, x, y});
            }

            // Tạo đáp án chuẩn
            this.solution = [...Array(count).keys()].sort(() => Math.random() - 0.5);
            for(let i=0; i<count-1; i++) {
                this.edges.push([this.solution[i], this.solution[i+1]]);
            }
            
            // Thêm cạnh phụ
            for(let i=0; i<count * 1.5; i++) {
                const a = Math.floor(Math.random()*count);
                const b = Math.floor(Math.random()*count);
                if(a !== b && !this.edges.some(e => (e[0]===a && e[1]===b))) {
                    this.edges.push([a, b]);
                }
            }
        }

        handleSelect(id) {
            if(this.path.includes(id)) {
                if(this.path[this.path.length-1] === id) this.path.pop();
                return;
            }

            const last = this.path[this.path.length-1];
            const canConnect = this.path.length === 0 || 
                this.edges.some(e => (e[0]===last && e[1]===id) || (e[1]===last && e[0]===id));

            if(canConnect) {
                this.path.push(id);
                this.createBurst(this.nodes[id].x, this.nodes[id].y);
                if(this.path.length === this.nodes.length) setTimeout(() => this.win(), 300);
            }
        }

        createBurst(x, y) {
            for(let i=0; i<12; i++) {
                this.stars.push({
                    x, y, 
                    vx: (Math.random()-0.5)*8, 
                    vy: (Math.random()-0.5)*8,
                    size: Math.random()*15 + 5, 
                    life: 1,
                    color: Math.random() > 0.5 ? '#f1c40f' : '#e67e22'
                });
            }
        }

        win() {
            if(this.isWon) return;
            this.isWon = true;
            const time = Math.floor((Date.now() - this.startTime)/1000);
            this.playWinSound();
            
            if(!this.isSolutionUsed) {
                this.records.push({name: this.userName, avatar: this.userAvatar, time, level: this.level});
                this.records.sort((a,b) => a.time - b.time);
                this.records = this.records.slice(0, 6);
                localStorage.setItem('hamilton_records_v2', JSON.stringify(this.records));
                this.updateLeaderboard();
            }

            document.getElementById('win-msg').innerText = this.isSolutionUsed ? "ĐÃ GIẢI XONG!" : "THÀNH CÔNG!";
            document.getElementById('win-time').innerText = `Thời gian hoàn thành: ${time} giây`;
            document.getElementById('win-screen').style.display = 'flex';
        }

        updateLeaderboard() {
            const lb = document.getElementById('leaderboard');
            lb.innerHTML = '<h4 style="margin:0 0 10px 0; text-align:center">🏆 TOP KỶ LỤC</h4>';
            if(this.records.length === 0) lb.innerHTML += '<div style="font-size:0.8rem; text-align:center">Chưa có dữ liệu</div>';
            this.records.forEach((r, idx) => {
                lb.innerHTML += `
                <div class="lb-item">
                    <span style="font-weight:bold">${idx+1}.</span>
                    <span>${r.avatar}</span>
                    <div style="flex-grow:1"><b>${r.name}</b></div>
                    <span style="color:var(--primary)">${r.time}s</span>
                </div>`;
            });
        }

        playTickSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.value = 600;
            g.gain.setValueAtTime(0.1, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
        }

        playWinSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [440, 554, 659, 880].forEach((f, i) => {
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.connect(g); g.connect(ctx.destination);
                osc.frequency.value = f;
                g.gain.setValueAtTime(0, ctx.currentTime + i*0.1);
                g.gain.linearRampToValueAtTime(0.1, ctx.currentTime + i*0.1 + 0.05);
                g.gain.linearRampToValueAtTime(0, ctx.currentTime + i*0.1 + 0.3);
                osc.start(ctx.currentTime + i*0.1); osc.stop(ctx.currentTime + i*0.1 + 0.4);
            });
        }

        showSolution() {
            if(this.isWon) return;
            this.isSolutionUsed = true;
            this.path = [];
            let i = 0;
            const timer = setInterval(() => {
                if(i < this.solution.length) {
                    this.handleSelect(this.solution[i]);
                    i++;
                } else clearInterval(timer);
            }, 400);
        }

        undo() { if(!this.isWon) this.path.pop(); }
        restart() { this.path = []; this.startTime = Date.now(); this.isSolutionUsed = false; }
        nextLevel() { this.level++; this.generateLevel(); }

        draw() {
            const {ctx, canvas} = this;
            ctx.clearRect(0,0, canvas.width, canvas.height);

            // Vẽ cạnh
            ctx.strokeStyle = '#d7ccc8'; ctx.lineWidth = 3;
            this.edges.forEach(e => {
                ctx.beginPath(); 
                ctx.moveTo(this.nodes[e[0]].x, this.nodes[e[0]].y);
                ctx.lineTo(this.nodes[e[1]].x, this.nodes[e[1]].y); 
                ctx.stroke();
            });

            // Vẽ đường đã đi
            if(this.path.length > 1) {
                ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 8; ctx.lineCap = 'round';
                ctx.beginPath();
                this.path.forEach((id, i) => {
                    const n = this.nodes[id];
                    if(i===0) ctx.moveTo(n.x, n.y); else ctx.lineTo(n.x, n.y);
                });
                ctx.stroke();
            }

            // Vẽ nút
            this.nodes.forEach(n => {
                const active = this.path.includes(n.id);
                const isLast = this.path[this.path.length-1] === n.id;
                
                ctx.fillStyle = active ? '#e67e22' : '#fff';
                ctx.shadowBlur = active ? 15 : 0;
                ctx.shadowColor = '#f1c40f';
                
                ctx.beginPath(); 
                ctx.arc(n.x, n.y, isLast ? 20 : 16, 0, Math.PI*2); 
                ctx.fill();
                
                ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 3;
                ctx.stroke();
                ctx.shadowBlur = 0;

                if(active) {
                    ctx.fillStyle = "white"; ctx.font = "14px serif";
                    ctx.fillText("⭐", n.x-8, n.y+5);
                }
            });

            // Vẽ hiệu ứng sao
            this.stars.forEach((s, i) => {
                ctx.fillStyle = s.color;
                ctx.globalAlpha = s.life;
                ctx.font = `${s.size}px serif`;
                ctx.fillText("⭐", s.x, s.y);
                s.x += s.vx; s.y += s.vy; s.life -= 0.02;
                if(s.life <= 0) this.stars.splice(i, 1);
            });
            ctx.globalAlpha = 1;

            if(!this.isWon && this.startTime > 0) {
                document.getElementById('timer').innerText = Math.floor((Date.now() - this.startTime)/1000);
            }
        }

        animate() { this.draw(); requestAnimationFrame(() => this.animate()); }
    }

    const game = new GoldenGame();
</script>
</body>
</html>
