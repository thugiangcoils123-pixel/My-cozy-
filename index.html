<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamilton Cosmic Adventure | Pro Version</title>
    <style>
        :root {
            --primary: #8a2be2;
            --secondary: #00f2ff;
            --bg: #050510;
            --surface: rgba(255, 255, 255, 0.08);
            --glow: 0 0 15px rgba(138, 43, 226, 0.5);
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        /* GUI Layer */
        .gui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .stats-card {
            background: var(--surface);
            backdrop-filter: blur(15px);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: var(--glow);
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: all;
        }

        button {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            font-weight: 600;
        }

        button:hover {
            background: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        #game-canvas {
            display: block;
            cursor: crosshair;
        }

        /* Win Modal */
        #modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.5s ease;
        }

        .modal-content {
            text-align: center;
            background: linear-gradient(145deg, #1a1a2e, #0a0a1a);
            padding: 40px;
            border-radius: 24px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.3);
        }

        h2 { font-size: 2.5rem; margin-top: 0; color: var(--secondary); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="gui-overlay">
        <div class="stats-card">
            <div>LEVEL: <span id="lvl-val" style="color:var(--secondary)">1</span></div>
            <div>TIME: <span id="time-val">00:00</span></div>
        </div>
    </div>

    <div class="controls">
        <button onclick="game.undo()">UNDO</button>
        <button onclick="game.restart()">RESTART</button>
        <button onclick="game.autoSolve()">HINT</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="modal">
        <div class="modal-content">
            <h2>MISSION SUCCESS</h2>
            <p id="win-msg" style="font-size: 1.2rem; margin-bottom: 30px;"></p>
            <button onclick="game.nextLevel()" style="padding: 15px 40px; font-size: 1.1rem;">NEXT GALAXY</button>
        </div>
    </div>

<script>
/**
 * ENGINE: Hamilton Cosmic Professional
 * Author: AI Assistant (Pro Upgrade)
 */

class GameEngine {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.level = 1;
        this.nodes = [];
        this.edges = [];
        this.path = [];
        this.solution = [];
        this.isDragging = false;
        this.isSolved = false;
        this.startTime = Date.now();
        
        this.particles = Array.from({length: 50}, () => ({
            x: Math.random(), y: Math.random(), r: Math.random() * 2, s: Math.random() * 0.001
        }));

        this.init();
        this.animate();
    }

    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.setupInput();
        this.generateLevel();
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    setupInput() {
        const handleDown = (e) => {
            const pos = this.getPos(e);
            const node = this.findNode(pos.x, pos.y);
            if (node !== null) {
                this.isDragging = true;
                this.addToPath(node);
            }
        };

        const handleMove = (e) => {
            if (!this.isDragging || this.isSolved) return;
            const pos = this.getPos(e);
            const node = this.findNode(pos.x, pos.y);
            if (node !== null) this.addToPath(node);
        };

        window.addEventListener('mousedown', handleDown);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', () => this.isDragging = false);
        window.addEventListener('touchstart', (e) => handleDown(e.touches[0]));
        window.addEventListener('touchmove', (e) => handleMove(e.touches[0]));
        window.addEventListener('touchend', () => this.isDragging = false);
    }

    getPos(e) {
        return { x: e.clientX, y: e.clientY };
    }

    generateLevel() {
        this.isSolved = false;
        this.path = [];
        this.nodes = [];
        this.edges = [];
        this.startTime = Date.now();
        document.getElementById('modal').style.display = 'none';

        const nodeCount = 4 + this.level;
        const padding = 100;
        
        // Tạo đường đi Hamilton trước để đảm bảo game giải được
        let currentPos = { x: this.canvas.width/2, y: this.canvas.height/2 };
        for(let i=0; i<nodeCount; i++) {
            let x, y, isValid = false;
            while(!isValid) {
                x = padding + Math.random() * (this.canvas.width - padding*2);
                y = padding + Math.random() * (this.canvas.height - padding*2);
                isValid = this.nodes.every(n => Math.hypot(n.x - x, n.y - y) > 120);
                if(isValid) {
                    const node = { id: i, x, y, color: `hsl(${250 + Math.random()*60}, 80%, 70%)`, pulse: 0 };
                    this.nodes.push(node);
                }
            }
        }

        // Tạo Solution Path
        this.solution = this.nodes.map(n => n.id);
        // Shuffle các điểm để người chơi không nhìn ra quy luật ngay
        for (let i = this.nodes.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [this.nodes[i].x, this.nodes[j].x] = [this.nodes[j].x, this.nodes[i].x];
            [this.nodes[i].y, this.nodes[j].y] = [this.nodes[j].y, this.nodes[i].y];
        }

        // Thêm các cạnh (edges) - Đảm bảo bao gồm cả solution
        for(let i=0; i<nodeCount; i++) {
            this.addEdge(this.solution[i], this.solution[(i+1)%nodeCount]); // Path chính
        }
        
        // Thêm cạnh nhiễu (fake edges)
        const fakeEdgesCount = this.level * 2;
        for(let i=0; i<fakeEdgesCount; i++) {
            const a = Math.floor(Math.random() * nodeCount);
            const b = Math.floor(Math.random() * nodeCount);
            if(a !== b) this.addEdge(a, b);
        }
    }

    addEdge(a, b) {
        if(!this.edges.some(e => (e[0]===a && e[1]===b) || (e[0]===b && e[1]===a))) {
            this.edges.push([a, b]);
        }
    }

    findNode(x, y) {
        for(let n of this.nodes) {
            if(Math.hypot(n.x - x, n.y - y) < 30) return n.id;
        }
        return null;
    }

    addToPath(nodeId) {
        if (this.path.includes(nodeId)) {
            // Cho phép lùi lại điểm trước đó (Undo nhanh)
            if(this.path[this.path.length-2] === nodeId) this.path.pop();
            return;
        }

        if (this.path.length === 0) {
            this.path.push(nodeId);
        } else {
            const lastNode = this.path[this.path.length - 1];
            if (this.edges.some(e => (e[0]===lastNode && e[1]===nodeId) || (e[0]===nodeId && e[1]===lastNode))) {
                this.path.push(nodeId);
                if (this.path.length === this.nodes.length) this.triggerWin();
            }
        }
    }

    triggerWin() {
        this.isSolved = true;
        const finalTime = document.getElementById('time-val').innerText;
        document.getElementById('win-msg').innerText = `You conquered level ${this.level} in ${finalTime}!`;
        document.getElementById('modal').style.display = 'flex';
    }

    nextLevel() {
        this.level++;
        document.getElementById('lvl-val').innerText = this.level;
        this.generateLevel();
    }

    undo() { this.path.pop(); }
    restart() { this.path = []; this.startTime = Date.now(); }

    autoSolve() {
        this.path = [];
        let i = 0;
        const interval = setInterval(() => {
            if (i >= this.solution.length) {
                clearInterval(interval);
                this.triggerWin();
            } else {
                this.path.push(this.solution[i]);
                i++;
            }
        }, 300);
    }

    updateTimer() {
        if(this.isSolved) return;
        const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
        const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const s = (elapsed % 60).toString().padStart(2, '0');
        document.getElementById('time-val').innerText = `${m}:${s}`;
    }

    draw() {
        const { ctx, canvas, nodes, edges, path } = this;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Background Particles
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        this.particles.forEach(p => {
            p.y -= p.s * canvas.height;
            if(p.y < 0) p.y = 1;
            ctx.beginPath();
            ctx.arc(p.x * canvas.width, p.y * canvas.height, p.r, 0, Math.PI*2);
            ctx.fill();
        });

        // 2. Draw Connections (Background)
        ctx.lineWidth = 2;
        edges.forEach(e => {
            const n1 = nodes[e[0]];
            const n2 = nodes[e[1]];
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            ctx.beginPath();
            ctx.moveTo(n1.x, n1.y);
            ctx.lineTo(n2.x, n2.y);
            ctx.stroke();
        });

        // 3. Draw Active Path (Glow effect)
        if (path.length > 1) {
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.lineWidth = 4;
            for (let i = 0; i < path.length - 1; i++) {
                const n1 = nodes[path[i]];
                const n2 = nodes[path[i+1]];
                ctx.shadowColor = n1.color;
                ctx.strokeStyle = n1.color;
                ctx.beginPath();
                ctx.moveTo(n1.x, n1.y);
                ctx.lineTo(n2.x, n2.y);
                ctx.stroke();
            }
            ctx.restore();
        }

        // 4. Draw Nodes
        nodes.forEach(n => {
            const isActive = path.includes(n.id);
            const isLast = path[path.length-1] === n.id;
            
            ctx.save();
            if(isActive) {
                ctx.shadowBlur = isLast ? 30 : 15;
                ctx.shadowColor = n.color;
                ctx.fillStyle = n.color;
            } else {
                ctx.fillStyle = "rgba(255,255,255,0.2)";
            }

            ctx.beginPath();
            ctx.arc(n.x, n.y, isLast ? 15 : 10, 0, Math.PI*2);
            ctx.fill();
            
            // Outer ring for last node
            if(isLast) {
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(n.x, n.y, 22 + Math.sin(Date.now()/200)*5, 0, Math.PI*2);
                ctx.stroke();
            }
            ctx.restore();
        });
    }

    animate() {
        this.updateTimer();
        this.draw();
        requestAnimationFrame(() => this.animate());
    }
}

// Khởi tạo game khi trang load xong
const game = new GameEngine();
</script>
</body>
</html>
