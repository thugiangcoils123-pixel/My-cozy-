<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starry Hamilton - Avatar Journey</title>
    <style>
        :root {
            --bg: #fff9e1; --primary: #f1c40f; --accent: #e67e22; --text: #5d4037;
        }

        body, html {
            margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
            background: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; touch-action: none;
        }

        canvas { position: absolute; inset: 0; display: block; }
        #bg-canvas { z-index: -1; }
        #game-canvas { z-index: 1; }
        #fx-canvas { z-index: 2; pointer-events: none; }

        /* UI Screens */
        .screen {
            position: fixed; inset: 0; z-index: 3000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255, 249, 225, 0.98); padding: 20px; text-align: center;
        }

        .glass-box {
            background: white; border-radius: 30px;
            border: 5px solid var(--primary); padding: 25px;
            box-shadow: 8px 8px 0px var(--accent); width: 90%; max-width: 400px;
        }

        /* Top Bar */
        .top-bar {
            position: fixed; top: 15px; width: 100%; display: flex;
            justify-content: space-around; align-items: center; pointer-events: none; z-index: 1000;
        }
        .ui-pill {
            background: white; border: 3px solid var(--primary); padding: 8px 15px;
            border-radius: 20px; font-weight: bold; pointer-events: auto;
            box-shadow: 4px 4px 0 var(--accent); font-size: 0.9rem; cursor: pointer;
        }

        /* Bottom Bar */
        .bottom-bar {
            position: fixed; bottom: 20px; width: 100%; display: flex;
            justify-content: center; gap: 10px; z-index: 1000;
        }

        button {
            background: var(--accent); color: white; border: none; padding: 12px 20px;
            border-radius: 25px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 #a04000; transition: 0.1s;
        }
        button:active { transform: translateY(3px); box-shadow: none; }

        .avatar-select { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .ava-opt { font-size: 2rem; cursor: pointer; padding: 5px; border-radius: 10px; border: 2px solid transparent; }
        .ava-opt.selected { border-color: var(--accent); background: #fffde7; }
        
        #lb-popup {
            position: fixed; inset: 0; z-index: 4000;
            background: rgba(0,0,0,0.5); display: none;
            justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        #lb-popup.active { display: flex; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <canvas id="game-canvas"></canvas>
    <canvas id="fx-canvas"></canvas>

    <!-- Chọn Avatar & Tên -->
    <div id="start-screen" class="screen">
        <div class="glass-box">
            <h2 style="color: var(--accent);">Chọn Người Bạn Đồng Hành</h2>
            <div class="avatar-select" id="avatar-list"></div>
            <input type="text" id="user-name" placeholder="Tên của bạn..." maxlength="10" 
                   style="width:80%; padding:12px; border-radius:15px; border:3px solid var(--primary); text-align:center; margin-bottom:15px;">
            <button onclick="game.start()">KHÁM PHÁ NGAY</button>
        </div>
    </div>

    <!-- UI -->
    <div class="top-bar">
        <div class="ui-pill">LV: <span id="lvl">1</span></div>
        <div class="ui-pill" onclick="UI.toggleLB()">🏆 XẾP HẠNG</div>
        <div class="ui-pill">⏱️ <span id="timer">0</span>s</div>
    </div>

    <div class="bottom-bar">
        <button onclick="game.undo()" style="background:#95a5a6; box-shadow: 0 4px 0 #7f8c8d;">Hoàn tác</button>
        <button onclick="game.toggleHint()" id="hint-btn" style="background:#3498db; box-shadow: 0 4px 0 #2980b9;">Gợi ý</button>
        <button onclick="game.resetLevel()" style="background:#e67e22;">Chơi lại</button>
    </div>

    <!-- Leaderboard -->
    <div id="lb-popup" onclick="UI.toggleLB()">
        <div class="glass-box" onclick="event.stopPropagation()">
            <h3 style="margin: 0 0 15px 0;">🏆 TOP THÁM HIỂM</h3>
            <div id="lb-content" style="max-height: 250px; overflow-y: auto; text-align: left; margin-bottom: 15px;"></div>
            <button onclick="UI.toggleLB()" style="width: 100%;">ĐÓNG</button>
        </div>
    </div>

    <!-- Win Screen -->
    <div id="win-screen" class="screen" style="display: none;">
        <div class="glass-box">
            <h1 style="color: var(--accent); margin: 0;">THÀNH CÔNG! 🎉</h1>
            <p id="win-msg" style="font-size: 1.2rem; margin: 20px 0;"></p>
            <button onclick="game.nextLevel()">MÀN TIẾP THEO</button>
        </div>
    </div>

<script>
const Sound = {
    ctx: new (window.AudioContext || window.webkitAudioContext)(),
    playWin() {
        const notes = [392.00, 440.00, 493.88, 523.25, 659.25]; // G4, A4, B4, C5, E5
        notes.forEach((f, i) => {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = 'sine'; o.connect(g); g.connect(this.ctx.destination);
            o.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.12);
            g.gain.setValueAtTime(0.3, this.ctx.currentTime + i * 0.12);
            g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.12 + 0.8);
            o.start(this.ctx.currentTime + i * 0.12); o.stop(this.ctx.currentTime + i * 0.12 + 1);
        });
    }
};

class FX {
    constructor() {
        this.canvas = document.getElementById('fx-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        window.addEventListener('resize', () => { this.canvas.width = innerWidth; this.canvas.height = innerHeight; });
        this.canvas.width = innerWidth; this.canvas.height = innerHeight;
    }
    confetti() {
        for(let i=0; i<80; i++) {
            this.particles.push({
                x: innerWidth/2, y: innerHeight/2,
                v: { x: (Math.random()-0.5)*20, y: (Math.random()-0.5)*20 },
                s: Math.random()*8 + 4, c: `hsl(${Math.random()*360}, 80%, 60%)`, a: 1
            });
        }
    }
    update() {
        this.ctx.clearRect(0,0,innerWidth, innerHeight);
        this.particles.forEach((p, i) => {
            p.x += p.v.x; p.y += p.v.y; p.v.y += 0.2; p.a -= 0.015;
            this.ctx.globalAlpha = Math.max(0, p.a);
            this.ctx.fillStyle = p.c;
            this.ctx.fillRect(p.x, p.y, p.s, p.s);
            if(p.a <= 0) this.particles.splice(i, 1);
        });
    }
}

const UI = {
    toggleLB() { document.getElementById('lb-popup').classList.toggle('active'); },
    initAvatars() {
        const list = document.getElementById('avatar-list');
        const avas = ['🐱','🐶','🦊','🐼','🦁','🐸','🐥','🐙'];
        avas.forEach(a => {
            const d = document.createElement('div');
            d.className = 'ava-opt'; d.innerText = a;
            if(a === '🐱') d.classList.add('selected');
            d.onclick = () => {
                document.querySelectorAll('.ava-opt').forEach(el => el.classList.remove('selected'));
                d.classList.add('selected'); game.userAvatar = a;
            };
            list.appendChild(d);
        });
    }
};

class HamiltonGame {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.bgCanvas = document.getElementById('bg-canvas');
        this.bgCtx = this.bgCanvas.getContext('2d');
        this.fx = new FX();
        
        this.level = 1; this.nodes = []; this.edges = []; this.path = []; this.solution = [];
        this.isWon = false; this.isHinting = false; this.startTime = 0;
        this.userAvatar = '🐱'; this.userName = '';
        this.records = JSON.parse(localStorage.getItem('hamilton_v7')) || [];

        window.addEventListener('resize', () => this.resize());
        this.resize();
        this.addListeners();
        UI.initAvatars();
        this.loop();
    }

    resize() {
        this.canvas.width = this.bgCanvas.width = window.innerWidth;
        this.canvas.height = this.bgCanvas.height = window.innerHeight;
    }

    addListeners() {
        const handler = (e) => {
            if(this.isWon) return;
            const x = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const y = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            this.checkClick(x, y);
        };
        this.canvas.addEventListener('mousedown', handler);
        this.canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handler(e); }, {passive:false});
    }

    start() {
        this.userName = document.getElementById('user-name').value || "Thám hiểm";
        document.getElementById('start-screen').style.display = 'none';
        this.generate();
    }

    generate() {
        this.nodes = []; this.edges = []; this.path = []; this.isWon = false;
        this.startTime = Date.now();
        document.getElementById('lvl').innerText = this.level;
        document.getElementById('win-screen').style.display = 'none';

        const count = this.level + 3;
        const margin = 100;

        for(let i=0; i<count; i++) {
            let x, y, tooClose;
            do {
                x = margin + Math.random() * (innerWidth - margin*2);
                y = 150 + Math.random() * (innerHeight - 300);
                tooClose = this.nodes.some(n => Math.hypot(n.x - x, n.y - y) < 130);
            } while(tooClose);
            this.nodes.push({id: i, x, y});
        }

        this.solution = [...Array(count).keys()].sort(() => Math.random() - 0.5);
        for(let i=0; i<count-1; i++) this.edges.push([this.solution[i], this.solution[i+1]]);
        
        const extra = Math.floor(count * 0.5);
        for(let i=0; i<extra; i++) {
            const a = Math.floor(Math.random()*count), b = Math.floor(Math.random()*count);
            if(a !== b && !this.edges.some(e => e.includes(a) && e.includes(b))) this.edges.push([a, b]);
        }
    }

    checkClick(ix, iy) {
        this.nodes.forEach(n => {
            if(Math.hypot(n.x - ix, n.y - iy) < 45) {
                const last = this.path[this.path.length-1];
                if(this.path.includes(n.id)) {
                    if(last === n.id) this.path.pop();
                } else if(this.path.length === 0 || this.edges.some(e => e.includes(last) && e.includes(n.id))) {
                    this.path.push(n.id);
                    if(this.path.length === this.nodes.length) this.win();
                }
            }
        });
    }

    win() {
        this.isWon = true;
        const time = Math.floor((Date.now() - this.startTime)/1000);
        Sound.playWin(); this.fx.confetti();
        
        this.records.push({name: this.userName, ava: this.userAvatar, time, level: this.level});
        this.records.sort((a,b) => b.level - a.level || a.time - b.time);
        localStorage.setItem('hamilton_v7', JSON.stringify(this.records.slice(0, 10)));
        
        document.getElementById('win-msg').innerText = `Cùng ${this.userAvatar} vượt màn ${this.level} trong ${time}s!`;
        document.getElementById('win-screen').style.display = 'flex';
        this.updateLB();
    }

    updateLB() {
        const content = document.getElementById('lb-content');
        content.innerHTML = this.records.map((r, i) => 
            `<div style="margin-bottom:8px;">${i+1}. ${r.ava} ${r.name} - LV${r.level} (${r.time}s)</div>`
        ).join('');
    }

    toggleHint() { this.isHinting = !this.isHinting; }
    undo() { this.path.pop(); }
    resetLevel() { this.path = []; this.isHinting = false; }
    nextLevel() { this.level++; this.generate(); }

    loop() {
        this.bgCtx.clearRect(0,0,innerWidth, innerHeight);
        this.ctx.clearRect(0,0,innerWidth, innerHeight);
        
        // Vẽ cạnh mờ
        this.ctx.strokeStyle = 'rgba(120, 120, 120, 0.15)'; this.ctx.lineWidth = 2;
        this.edges.forEach(e => {
            this.ctx.beginPath(); this.ctx.moveTo(this.nodes[e[0]].x, this.nodes[e[0]].y);
            this.ctx.lineTo(this.nodes[e[1]].x, this.nodes[e[1]].y); this.ctx.stroke();
        });

        // Vẽ đường đi
        if(this.path.length > 1) {
            this.ctx.strokeStyle = '#e67e22'; this.ctx.lineWidth = 6; this.ctx.lineCap = 'round';
            this.ctx.beginPath();
            this.path.forEach((id, i) => {
                const n = this.nodes[id];
                if(i===0) this.ctx.moveTo(n.x, n.y); else this.ctx.lineTo(n.x, n.y);
            });
            this.ctx.stroke();
        }

        // Vẽ các trạm & Avatar
        this.nodes.forEach(n => {
            const active = this.path.includes(n.id);
            const isCurrent = this.path[this.path.length-1] === n.id;
            
            this.ctx.fillStyle = active ? '#f1c40f' : '#fff';
            this.ctx.strokeStyle = '#e67e22'; this.ctx.lineWidth = 3;
            this.ctx.beginPath(); this.ctx.arc(n.x, n.y, 22, 0, Math.PI*2);
            this.ctx.fill(); this.ctx.stroke();

            // Hiện Avatar tại điểm hiện tại
            if(isCurrent) {
                this.ctx.font = "30px Arial";
                this.ctx.fillText(this.userAvatar, n.x - 15, n.y - 30);
            }
        });

        if(!this.isWon && this.startTime > 0) document.getElementById('timer').innerText = Math.floor((Date.now() - this.startTime)/1000);
        this.fx.update();
        requestAnimationFrame(() => this.loop());
    }
}

const game = new HamiltonGame();
</script>
</body>
</html>
