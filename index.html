<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hamilton Game</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:radial-gradient(circle,#0b0b2a,#000);
  color:white;
}

/* LAYOUT */
.container{
  max-width:700px;
  margin:auto;
  padding:10px;
}

h1{
  text-align:center;
  color:#caa6ff;
  text-shadow:0 0 20px #caa6ff;
}

/* PANEL */
.panel{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-bottom:10px;

  backdrop-filter:blur(10px);
  background:rgba(255,255,255,0.05);
  border-radius:10px;
  padding:10px;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:linear-gradient(45deg,#caa6ff,#7a5cff);
  color:white;
  cursor:pointer;
  transition:0.2s;
}
button:hover{
  transform:scale(1.1);
  box-shadow:0 0 10px #caa6ff;
}

/* CANVAS */
.canvasWrap{
  width:100%;
  aspect-ratio:1/1;
}
canvas{
  width:100%;
  height:100%;
  border-radius:12px;
  background:black;
  box-shadow:0 0 40px rgba(150,100,255,0.3);
}

/* WIN */
#winBox{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.7);
}
#winBox.show{display:flex;}

.winContent{
  background:#111;
  padding:20px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 30px #caa6ff;
}
</style>
</head>

<body>

<div class="container">

<h1>🌙 Hamilton Game</h1>

<div class="panel">
Level: <span id="level">1</span>
Time: <span id="time">0</span>s
</div>

<div class="panel">
<button onclick="undo()">Undo</button>
<button onclick="restart()">Restart</button>
<button onclick="showAnswer()">Answer</button>
</div>

<div class="canvasWrap">
<canvas id="game"></canvas>
</div>

</div>

<div id="winBox">
  <div class="winContent">
    <h2>✨ You Win!</h2>
    <p id="result"></p>
    <button onclick="nextLevel()">Next Level</button>
  </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

/* RESPONSIVE */
function resizeCanvas(){
  const rect=canvas.getBoundingClientRect();
  const ratio=window.devicePixelRatio||1;
  canvas.width=rect.width*ratio;
  canvas.height=rect.height*ratio;
  ctx.setTransform(ratio,0,0,ratio,0,0);
}
window.addEventListener("resize",resizeCanvas);
resizeCanvas();

/* GAME */
let graph,path=[],level=1,dragging=false,showingAnswer=false;

/* TIMER */
let startTime,timer;
function startTimer(){
  startTime=Date.now();
  clearInterval(timer);
  timer=setInterval(()=>{
    document.getElementById("time").innerText=
      Math.floor((Date.now()-startTime)/1000);
  },200);
}

/* STARS */
let stars=[];
for(let i=0;i<120;i++){
  stars.push({x:Math.random(),y:Math.random(),a:Math.random()});
}

/* METEORS */
let meteors=[];
function spawnMeteor(){
  meteors.push({
    x:Math.random(),
    y:0,
    vx:0.5,
    vy:0.5,
    life:1
  });
}

/* GRAPH */
class Graph{
  constructor(n){
    this.nodes=[];
    this.edges={};
    this.solution=[];

    let MIN=Math.max(0.15-level*0.005,0.08);

    for(let i=0;i<n;i++){
      let x,y,tries=0;
      do{
        x=0.1+Math.random()*0.8;
        y=0.1+Math.random()*0.8;
        tries++;
      }while(!this.ok(x,y,MIN)&&tries<100);

      this.nodes.push({
        id:i,x,y,
        color:`hsl(${Math.random()*360},100%,70%)`
      });

      this.edges[i]=[];
    }

    for(let i=0;i<n-1;i++){
      this.link(i,i+1);
      this.solution.push(i);
    }
    this.solution.push(n-1);

    let density=Math.max(0.3-level*0.02,0.05);

    for(let i=0;i<n;i++){
      for(let j=i+2;j<n;j++){
        if(Math.random()<density) this.link(i,j);
      }
    }
  }

  ok(x,y,min){
    return this.nodes.every(n=>{
      return Math.hypot(n.x-x,n.y-y)>min;
    });
  }

  link(a,b){
    this.edges[a].push(b);
    this.edges[b].push(a);
  }

  isConnected(a,b){
    return this.edges[a].includes(b);
  }
}

/* DRAW */
function draw(){
  const w=canvas.clientWidth;
  const h=canvas.clientHeight;

  ctx.clearRect(0,0,w,h);

  // stars
  stars.forEach(s=>{
    ctx.fillStyle=`rgba(255,255,255,${s.a})`;
    ctx.fillRect(s.x*w,s.y*h,2,2);
    s.a+=(Math.random()-0.5)*0.02;
  });

  // meteors
  meteors.forEach(m=>{
    ctx.strokeStyle="white";
    ctx.beginPath();
    ctx.moveTo(m.x*w,m.y*h);
    ctx.lineTo((m.x-0.05)*w,(m.y-0.05)*h);
    ctx.stroke();

    m.x+=0.01;
    m.y+=0.01;
    m.life-=0.01;
  });

  meteors=meteors.filter(m=>m.life>0);
  if(Math.random()<0.03) spawnMeteor();

  // edges
  for(let a in graph.edges){
    for(let b of graph.edges[a]){
      let A=graph.nodes[a],B=graph.nodes[b];
      ctx.strokeStyle="rgba(255,255,255,0.1)";
      ctx.beginPath();
      ctx.moveTo(A.x*w,A.y*h);
      ctx.lineTo(B.x*w,B.y*h);
      ctx.stroke();
    }
  }

  // path
  ctx.lineWidth=4;
  ctx.shadowBlur=20;

  for(let i=0;i<path.length-1;i++){
    let A=graph.nodes[path[i]];
    let B=graph.nodes[path[i+1]];
    ctx.strokeStyle=A.color;
    ctx.shadowColor=A.color;

    ctx.beginPath();
    ctx.moveTo(A.x*w,A.y*h);
    ctx.lineTo(B.x*w,B.y*h);
    ctx.stroke();
  }

  ctx.shadowBlur=0;

  // nodes
  graph.nodes.forEach(n=>{
    ctx.beginPath();
    ctx.arc(n.x*w,n.y*h,10,0,Math.PI*2);

    ctx.fillStyle=path.includes(n.id)?n.color:"#fff";
    ctx.shadowBlur=10;
    ctx.shadowColor=n.color;
    ctx.fill();
    ctx.shadowBlur=0;
  });
}

/* LOOP */
function loop(){
  draw();
  requestAnimationFrame(loop);
}

/* INPUT */
function getNode(e){
  let rect=canvas.getBoundingClientRect();
  let x=(e.clientX-rect.left)/rect.width;
  let y=(e.clientY-rect.top)/rect.height;

  let nearest=null,min=0.05;
  graph.nodes.forEach(n=>{
    let d=Math.hypot(n.x-x,n.y-y);
    if(d<min){min=d;nearest=n.id;}
  });
  return nearest;
}

canvas.onmousedown=()=>dragging=true;
canvas.onmouseup=()=>dragging=false;

canvas.onmousemove=e=>{
  if(!dragging||showingAnswer) return;

  let node=getNode(e);
  if(node==null) return;

  if(path.length==0||graph.isConnected(path[path.length-1],node)){
    if(!path.includes(node)){
      path.push(node);
      if(path.length===graph.nodes.length) win();
    }
  }
};

/* ANSWER */
function showAnswer(){
  if(showingAnswer) return;
  showingAnswer=true;
  path=[];
  let i=0;

  function step(){
    if(i<graph.solution.length){
      path.push(graph.solution[i]);
      i++;
      setTimeout(step,200);
    }else showingAnswer=false;
  }
  step();
}

/* WIN */
function win(){
  clearInterval(timer);
  let t=Math.floor((Date.now()-startTime)/1000);

  document.getElementById("result").innerText="Time: "+t+"s";
  document.getElementById("winBox").classList.add("show");
}

/* SYSTEM */
function nextLevel(){
  document.getElementById("winBox").classList.remove("show");
  level++;
  start();
}

function undo(){ path.pop(); }
function restart(){ path=[]; startTimer(); }

function start(){
  document.getElementById("level").innerText=level;
  graph=new Graph(4+level);
  path=[];
  startTimer();
}

start();
loop();
</script>

</body>
</html>
