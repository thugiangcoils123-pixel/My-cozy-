<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hamilton Galaxy Ultra</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #02020a;
            color: #fff;
            font-family: 'Syncopate', sans-serif;
            touch-action: none; /* Ngăn scroll trên mobile */
        }

        /* Giao diện Overlay hiện đại */
        .game-ui {
            position: absolute;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 10px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .stats { font-size: clamp(0.7rem, 2vw, 1.1rem); letter-spacing: 2px; }

        .btn-group {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: all;
        }

        button {
            background: var(--glass);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            backdrop-filter: blur(5px);
            font-family: inherit;
            font-size: 0.8rem;
        }

        button:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 25px var(--neon-blue);
        }

        #game-canvas { display: block; width: 100vw; height: 100vh; }

        /* Màn hình thắng cuộc xịn xò */
        #win-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(20,0,50,0.9) 0%, rgba(0,0,0,1) 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        #win-screen h1 {
            font-size: clamp(2rem, 8vw, 5rem);
            margin: 0;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px var(--neon-blue));
        }
    </style>
</head>
<body>

    <div class="game-ui">
        <div class="glass-panel stats">LEVEL: <span id="lvl" style="color: var(--neon-blue)">1</span></div>
        <div class="glass-panel stats">TIME: <span id="timer">00:00</span></div>
    </div>

    <div class="btn-group">
        <button onclick="game.undo()">UNDO</button>
        <button onclick="game.restart()">RESTART</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="win-screen">
        <h1 id="win-title">GALAXY LINKED</h1>
        <p id="win-meta" style="letter-spacing: 5px; margin: 20px 0; color: #aaa;"></p>
        <button onclick="game.nextLevel()" style="padding: 20px 60px;">NEXT GALAXY</button>
    </div>

<script>
class GalaxyPro {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.level = 1;
        this.nodes = [];
        this.edges = [];
        this.path = [];
        this.particles = [];
        this.isWon = false;
        this.startTime = Date.now();
        this.pixelRatio = window.devicePixelRatio || 1;

        this.init();
        this.animate();
    }

    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.setupInput();
        this.generateLevel();
    }

    resize() {
        this.canvas.width = window.innerWidth * this.pixelRatio;
        this.canvas.height = window.innerHeight * this.pixelRatio;
        this.ctx.scale(this.pixelRatio, this.pixelRatio);
        if (this.nodes.length > 0) this.generateLevel(); // Re-layout nodes on resize
    }

    generateLevel() {
        this.nodes = [];
        this.edges = [];
        this.path = [];
        this.isWon = false;
        this.startTime = Date.now();
        document.getElementById('win-screen').style.display = 'none';

        const count = 4 + this.level;
        // Padding động dựa trên kích thước màn hình
        const padX = window.innerWidth * 0.15;
        const padY = window.innerHeight * 0.2;

        for(let i=0; i<count; i++) {
            let x, y, ok = false;
            while(!ok) {
                x = padX + Math.random() * (window.innerWidth - padX*2);
                y = padY + Math.random() * (window.innerHeight - padY*2);
                ok = this.nodes.every(n => Math.hypot(n.x - x, n.y - y) > 80);
            }
            this.nodes.push({id: i, x, y, r: Math.random()*2 + 3});
        }

        // Đảm bảo game giải được (Hamilton Path)
        const seq = [...Array(count).keys()].sort(() => Math.random() - 0.5);
        for(let i=0; i<count-1; i++) this.edges.push([seq[i], seq[i+1]]);
        
        // Thêm cạnh nhiễu (Rõ ràng hơn)
        for(let i=0; i<count*1.5; i++) {
            const a = Math.floor(Math.random()*count);
            const b = Math.floor(Math.random()*count);
            if(a !== b && !this.edges.some(e => e.includes(a) && e.includes(b))) {
                this.edges.push([a, b]);
            }
        }
    }

    setupInput() {
        const handle = (e) => {
            if(this.isWon) return;
            const rect = this.canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            
            this.nodes.forEach(n => {
                if(Math.hypot(n.x - x, n.y - y) < 35) this.selectNode(n.id);
            });
        };
        this.canvas.addEventListener('mousedown', handle);
        this.canvas.addEventListener('touchstart', handle);
    }

    selectNode(id) {
        if(this.path.includes(id)) {
            if(this.path[this.path.length-2] === id) this.path.pop();
            return;
        }
        if(this.path.length === 0) {
            this.path.push(id);
        } else {
            const last = this.path[this.path.length-1];
            if(this.edges.some(e => (e[0]===last && e[1]===id) || (e[1]===last && e[0]===id))) {
                this.path.push(id);
                if(this.path.length === this.nodes.length) this.win();
            }
        }
    }

    win() {
        this.isWon = true;
        document.getElementById('win-meta').innerText = `LEVEL ${this.level} COMPLETED IN ${document.getElementById('timer').innerText}`;
        setTimeout(() => {
            document.getElementById('win-screen').style.display = 'flex';
        }, 500);
    }

    nextLevel() { this.level++; document.getElementById('lvl').innerText = this.level; this.generateLevel(); }
    undo() { this.path.pop(); }
    restart() { this.path = []; this.startTime = Date.now(); }

    draw() {
        const {ctx, canvas} = this;
        const w = window.innerWidth;
        const h = window.innerHeight;

        // 1. Background (Gradient mượt)
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w);
        grad.addColorStop(0, '#0a0a25');
        grad.addColorStop(1, '#02020a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        // 2. Draw Edges (Cạnh có thể đi - Nổi bật hơn)
        ctx.setLineDash([]);
        this.edges.forEach(e => {
            const n1 = this.nodes[e[0]], n2 = this.nodes[e[1]];
            ctx.strokeStyle = 'rgba(0, 242, 255, 0.25)'; // Màu Neon nhạt rõ hơn
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(n1.x, n1.y);
            ctx.lineTo(n2.x, n2.y);
            ctx.stroke();
            
            // Điểm nhấn ở giữa cạnh để tạo chiều sâu
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            ctx.beginPath();
            ctx.arc((n1.x+n2.x)/2, (n1.y+n2.y)/2, 1, 0, Math.PI*2);
            ctx.fill();
        });

        // 3. Draw Active Path (Rực rỡ)
        if(this.path.length > 1) {
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f2ff';
            ctx.strokeStyle = '#00f2ff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            this.path.forEach((id, i) => {
                const n = this.nodes[id];
                if(i===0) ctx.moveTo(n.x, n.y);
                else ctx.lineTo(n.x, n.y);
            });
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // 4. Draw Nodes (Glassmorphism)
        this.nodes.forEach(n => {
            const active = this.path.includes(n.id);
            const last = this.path[this.path.length-1] === n.id;
            
            // Aura xung quanh
            if(active) {
                const pulse = Math.sin(Date.now()*0.005)*5;
                ctx.fillStyle = 'rgba(0, 242, 255, 0.1)';
                ctx.beginPath();
                ctx.arc(n.x, n.y, 20 + pulse, 0, Math.PI*2);
                ctx.fill();
            }

            ctx.beginPath();
            ctx.arc(n.x, n.y, last ? 10 : 7, 0, Math.PI*2);
            ctx.fillStyle = active ? '#00f2ff' : '#fff';
            ctx.fill();
            
            if(!active) {
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(n.x, n.y, 12, 0, Math.PI*2);
                ctx.stroke();
            }
        });

        // Timer update
        if(!this.isWon) {
            const sec = Math.floor((Date.now() - this.startTime)/1000);
            document.getElementById('timer').innerText = 
                `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;
        }
    }

    animate() {
        this.draw();
        requestAnimationFrame(() => this.animate());
    }
}

const game = new GalaxyPro();
</script>
</body>
</html>
