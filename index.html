<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamilton Galaxy Odyssey</title>
    <style>
        :root {
            --neon: #00f2ff;
            --purple: #bc13fe;
            --bg: #020205;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Orbitron', sans-serif; /* Bạn có thể import font này từ Google Font */
            color: white;
            user-select: none;
        }

        /* Overlay UI */
        .ui-layer {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 10;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        button {
            background: linear-gradient(45deg, var(--purple), var(--neon));
            border: none;
            padding: 12px 25px;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 0 20px var(--neon);
        }

        #game-canvas { display: block; }

        /* Win Animation Overlay */
        #win-overlay {
            position: fixed;
            inset: 0;
            display: none;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .win-card {
            text-align: center;
            padding: 50px;
            background: rgba(10, 10, 30, 0.9);
            border: 2px solid var(--neon);
            border-radius: 30px;
            box-shadow: 0 0 100px var(--purple);
        }
    </style>
</head>
<body>

    <div class="ui-layer">
        <div class="stat-box">LEVEL: <span id="lvl" style="color: var(--neon)">1</span></div>
        <div class="stat-box">TIME: <span id="timer">00:00</span></div>
    </div>

    <div class="controls">
        <button onclick="game.undo()">Undo</button>
        <button onclick="game.restart()">Restart</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="win-overlay">
        <div class="win-card">
            <h1 style="font-size: 3em; margin: 0; color: var(--neon);">SUPERNOVA!</h1>
            <p id="win-detail" style="font-size: 1.2em; margin: 20px 0;"></p>
            <button onclick="game.nextLevel()">Tiến vào Thiên hà tiếp theo</button>
        </div>
    </div>

<script>
class GalaxyEngine {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.level = 1;
        this.nodes = [];
        this.edges = [];
        this.path = [];
        this.stars = [];
        this.meteors = [];
        this.winParticles = [];
        this.isWon = false;
        this.startTime = Date.now();

        this.init();
        this.animate();
    }

    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.createStars();
        this.generateLevel();
        this.setupInput();
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    createStars() {
        this.stars = Array.from({length: 200}, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 2,
            opacity: Math.random(),
            speed: Math.random() * 0.5
        }));
    }

    spawnMeteor() {
        if(Math.random() < 0.02) {
            this.meteors.push({
                x: Math.random() * window.innerWidth,
                y: -20,
                vx: 4 + Math.random() * 4,
                vy: 4 + Math.random() * 4,
                life: 1
            });
        }
    }

    generateLevel() {
        this.nodes = [];
        this.edges = [];
        this.path = [];
        this.isWon = false;
        this.winParticles = [];
        this.startTime = Date.now();
        document.getElementById('win-overlay').style.display = 'none';

        const count = 4 + this.level;
        const pad = 100;

        // Tạo nodes đảm bảo không chồng lấn
        for(let i=0; i<count; i++) {
            let x, y, ok = false;
            while(!ok) {
                x = pad + Math.random() * (this.canvas.width - pad*2);
                y = pad + Math.random() * (this.canvas.height - pad*2);
                ok = this.nodes.every(n => Math.hypot(n.x - x, n.y - y) > 120);
            }
            this.nodes.push({id: i, x, y, pulse: 0});
        }

        // Tạo path Hamilton mẫu
        const sequence = [...Array(count).keys()].sort(() => Math.random() - 0.5);
        for(let i=0; i<count-1; i++) {
            this.edges.push([sequence[i], sequence[i+1]]);
        }
        // Thêm cạnh nhiễu
        for(let i=0; i<count; i++) {
            const a = Math.floor(Math.random()*count);
            const b = Math.floor(Math.random()*count);
            if(a !== b && !this.edges.some(e => e.includes(a) && e.includes(b))) {
                this.edges.push([a, b]);
            }
        }
    }

    setupInput() {
        const check = (e) => {
            if(this.isWon) return;
            const x = e.clientX || e.touches[0].clientX;
            const y = e.clientY || e.touches[0].clientY;
            
            this.nodes.forEach(n => {
                if(Math.hypot(n.x - x, n.y - y) < 40) {
                    this.handleNodeSelect(n.id);
                }
            });
        };
        window.addEventListener('mousedown', check);
        window.addEventListener('touchstart', check);
    }

    handleNodeSelect(id) {
        if(this.path.includes(id)) {
            if(this.path[this.path.length-2] === id) this.path.pop();
            return;
        }

        if(this.path.length === 0) {
            this.path.push(id);
        } else {
            const last = this.path[this.path.length-1];
            if(this.edges.some(e => (e[0]===last && e[1]===id) || (e[0]===id && e[1]===last))) {
                this.path.push(id);
                if(this.path.length === this.nodes.length) this.win();
            }
        }
    }

    win() {
        this.isWon = true;
        // Tạo hiệu ứng hạt nổ Supernova
        for(let i=0; i<150; i++) {
            this.winParticles.push({
                x: this.canvas.width/2,
                y: this.canvas.height/2,
                vx: (Math.random()-0.5)*15,
                vy: (Math.random()-0.5)*15,
                color: Math.random() > 0.5 ? '#00f2ff' : '#bc13fe',
                life: 1
            });
        }
        document.getElementById('win-detail').innerText = `Thiên hà thứ ${this.level} đã được thắp sáng!`;
        setTimeout(() => {
            document.getElementById('win-overlay').style.display = 'flex';
        }, 1000);
    }

    nextLevel() {
        this.level++;
        document.getElementById('lvl').innerText = this.level;
        this.generateLevel();
    }

    undo() { this.path.pop(); }
    restart() { this.path = []; this.startTime = Date.now(); }

    draw() {
        const {ctx, canvas} = this;
        ctx.fillStyle = '#020205';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 1. Galaxy Background & Meteors
        this.stars.forEach(s => {
            s.opacity = 0.5 + Math.sin(Date.now()*0.001 + s.x)*0.5;
            ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
            ctx.fillRect(s.x, s.y, s.size, s.size);
        });

        this.spawnMeteor();
        this.meteors.forEach((m, i) => {
            ctx.strokeStyle = `rgba(255,255,255,${m.life})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(m.x - m.vx*3, m.y - m.vy*3);
            ctx.stroke();
            m.x += m.vx; m.y += m.vy; m.life -= 0.01;
            if(m.life <= 0) this.meteors.splice(i, 1);
        });

        // 2. Edges (Đường nối rõ nét hơn)
        ctx.lineWidth = 3;
        this.edges.forEach(e => {
            const n1 = this.nodes[e[0]], n2 = this.nodes[e[1]];
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.setLineDash([5, 5]); // Tạo hiệu ứng đường đứt đoạn công nghệ
            ctx.beginPath();
            ctx.moveTo(n1.x, n1.y);
            ctx.lineTo(n2.x, n2.y);
            ctx.stroke();
        });
        ctx.setLineDash([]);

        // 3. Path (Đường đã đi - Neon)
        if(this.path.length > 1) {
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00f2ff';
            ctx.strokeStyle = '#00f2ff';
            ctx.lineWidth = 5;
            ctx.beginPath();
            this.path.forEach((id, i) => {
                const n = this.nodes[id];
                if(i===0) ctx.moveTo(n.x, n.y);
                else ctx.lineTo(n.x, n.y);
            });
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // 4. Nodes (Các hành tinh)
        this.nodes.forEach(n => {
            const active = this.path.includes(n.id);
            const last = this.path[this.path.length-1] === n.id;
            
            ctx.beginPath();
            ctx.arc(n.x, n.y, active ? 12 : 8, 0, Math.PI*2);
            ctx.fillStyle = active ? '#bc13fe' : '#fff';
            if(last) {
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#bc13fe';
            }
            ctx.fill();
            ctx.shadowBlur = 0;

            // Halo effect
            if(active) {
                ctx.strokeStyle = 'rgba(188, 19, 254, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(n.x, n.y, 20 + Math.sin(Date.now()*0.005)*5, 0, Math.PI*2);
                ctx.stroke();
            }
        });

        // 5. Win Particles (Supernova)
        this.winParticles.forEach((p, i) => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
            ctx.fill();
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            if(p.life <= 0) this.winParticles.splice(i, 1);
        });
        ctx.globalAlpha = 1;

        // Update Timer
        if(!this.isWon) {
            const sec = Math.floor((Date.now() - this.startTime)/1000);
            document.getElementById('timer').innerText = 
                `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;
        }
    }

    animate() {
        this.draw();
        requestAnimationFrame(() => this.animate());
    }
}

const game = new GalaxyEngine();
</script>
</body>
</html>
